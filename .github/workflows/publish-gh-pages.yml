name: Archived Blazor Pages build

# Legacy Blazor deployment workflow kept for reference.
# The active portfolio is published from the gh-pages branch, so this workflow
# is intentionally manual-only to avoid unrelated red runs on every site push.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "legacy-blazor-pages"
  cancel-in-progress: true

jobs:
  build_test_artifact:
    name: Build archived Blazor app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      - name: Restore NuGet packages
        run: dotnet restore .
      - name: Build solution
        run: dotnet build .
      - name: Test solution
        run: dotnet test . -c Release
      - name: Publish artifact
        run: dotnet publish src/BlazorApp -c Release -o published
      - name: Upload artifact for web
        uses: actions/upload-pages-artifact@v3
        with:
          path: published/wwwroot

  deploy:
    name: Deploy archived Blazor app to GitHub Pages
    needs: build_test_artifact
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
