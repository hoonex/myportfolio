name: Temporary Sloar 0.10 main install

on:
  push:
    branches:
      - chore/sloar-010-main

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact task branch
        uses: actions/checkout@v4
        with:
          ref: chore/sloar-010-main
          fetch-depth: 0

      - name: Install canonical Sloar 0.10.0 bundle
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/hoonex/sloar-chat-coder.git "$RUNNER_TEMP/sloar"
          git -C "$RUNNER_TEMP/sloar" checkout --detach 2fbca76a97017ebf88295b52d080b8158ffbd186
          python3 "$RUNNER_TEMP/sloar/.agents/skills/sloar-chat-coder/scripts/install.py" --target "$GITHUB_WORKSPACE" --force
          grep -F 'version: "0.10.0"' .agents/skills/sloar-chat-coder/SKILL.md
          test -f .agents/skills/web-design-guidance/SKILL.md
          test -f .agents/skills/apple-web-design/SKILL.md

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 .agents/skills/sloar-chat-coder/scripts/doctor.py . --json
          diff -qr "$RUNNER_TEMP/sloar/.agents/skills/sloar-chat-coder" .agents/skills/sloar-chat-coder
          diff -qr "$RUNNER_TEMP/sloar/.agents/skills/web-design-guidance" .agents/skills/web-design-guidance
          diff -qr "$RUNNER_TEMP/sloar/.agents/skills/apple-web-design" .agents/skills/apple-web-design
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md .agents/skills
          if git diff --cached --quiet; then
            echo "Sloar bundle already exact."
            exit 0
          fi
          git commit -m "chore: install Sloar Chat Coder 0.10.0"
          git push origin HEAD:chore/sloar-010-main
