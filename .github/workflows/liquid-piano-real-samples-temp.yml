name: Temporary Liquid Piano real samples verify
on:
  push:
    branches:
      - fix/liquid-piano-real-samples-bass
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/liquid-piano-real-samples-bass
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python .github/patch-liquid-piano-real-samples.py
      - name: Verify JavaScript and contracts
        run: |
          node --check journal-v15-liquid-piano.js
          grep -q "SAMPLE_BASE='https://tonejs.github.io/audio/salamander/'" journal-v15-liquid-piano.js
          grep -q "createBufferSource" journal-v15-liquid-piano.js
          grep -q "bass.type='lowshelf'" journal-v15-liquid-piano.js
          grep -q "bass.gain.value=5.25" journal-v15-liquid-piano.js
          grep -q "Salamander Grand Piano" journal-v15-liquid-piano.js
          grep -q "SITE50-LIQUIDPIANO3_2-REALPIANO-20260915-1522" journal-route-loader.js
          grep -q "SITE50-LIQUIDPIANO3_2-REALPIANO-20260915-1522" index.html
          grep -q 'lp-sample-credit' journal-v15-liquid-piano.css
      - name: Verify sample endpoint and CORS
        run: |
          curl -fsSI https://tonejs.github.io/audio/salamander/C3.mp3 | tr -d '\r' | tee /tmp/headers
          grep -qi '^access-control-allow-origin:' /tmp/headers
      - name: Commit product patch
        run: |
          git config user.name "hoonex"
          git config user.email "163626004+hoonex@users.noreply.github.com"
          git add journal-v15-liquid-piano.js journal-v15-liquid-piano.css journal-route-loader.js index.html
          git commit -m "fix: use real piano samples and strengthen bass"
          git push origin HEAD:fix/liquid-piano-real-samples-bass
