name: Vision SVG fallback once
on:
  push:
    branches: [feat/design-journal-liquid-glass-20260827]
    paths: ['.github/scripts/patch-vision-svg-fallback.py','.github/workflows/vision-svg-fallback-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/design-journal-liquid-glass-20260827
      - run: python .github/scripts/patch-vision-svg-fallback.py
      - run: |
          rm .github/scripts/patch-vision-svg-fallback.py .github/workflows/vision-svg-fallback-once.yml
          git config user.name hoonex
          git config user.email 163626004+hoonex@users.noreply.github.com
          git add -A
          git commit -m 'fix: add Android SVG face mesh fallback'
          git push origin HEAD:feat/design-journal-liquid-glass-20260827
