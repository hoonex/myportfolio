name: Temporary Vision v14 foreground layer fix

on:
  push:
    branches:
      - fix/vision-v14-foreground-layer

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vision-v14-foreground-layer
          fetch-depth: 0

      - name: Move interactive art above all tracking meshes
        run: |
          python - <<'PY'
          from pathlib import Path

          js = Path('journal-v14-vision.js')
          s = js.read_text()
          old = "updateArt(dt,ps,F,w,h,now);drawFace(ctx,F,w,h);drawArt(ctx,w,h,ps,F,now);H.forEach((x,i)=>drawHand(ctx,x,i,w));drawPinchFeedback(ctx,ps,w,h);"
          new = "updateArt(dt,ps,F,w,h,now);drawFace(ctx,F,w,h);H.forEach((x,i)=>drawHand(ctx,x,i,w));drawArt(ctx,w,h,ps,F,now);drawPinchFeedback(ctx,ps,w,h);"
          if s.count(old) != 1:
              raise SystemExit(f'expected one render-order owner, found {s.count(old)}')
          s = s.replace(old, new, 1)
          if "BUILD='VISION14.1-20260912-1650'" not in s:
              raise SystemExit('unexpected Vision build owner')
          s = s.replace("BUILD='VISION14.1-20260912-1650'", "BUILD='VISION14.2-20260912-1842'", 1)
          js.write_text(s)

          loader = Path('journal-route-loader.js')
          t = loader.read_text()
          old_rev = 'SITE37-VISION14_1-20260912-1650'
          new_rev = 'SITE38-VISION14_2-20260912-1842'
          if t.count(old_rev) != 1:
              raise SystemExit(f'unexpected loader revision count: {t.count(old_rev)}')
          loader.write_text(t.replace(old_rev, new_rev, 1))

          index = Path('index.html')
          u = index.read_text()
          if u.count(old_rev) != 2:
              raise SystemExit(f'unexpected index revision count: {u.count(old_rev)}')
          index.write_text(u.replace(old_rev, new_rev))
          PY

      - name: Verify layer ownership
        run: |
          set -euo pipefail
          node --check journal-v14-vision.js
          node --check journal-route-loader.js
          python - <<'PY'
          from pathlib import Path
          s=Path('journal-v14-vision.js').read_text()
          order='drawFace(ctx,F,w,h);H.forEach((x,i)=>drawHand(ctx,x,i,w));drawArt(ctx,w,h,ps,F,now);drawPinchFeedback(ctx,ps,w,h);'
          assert order in s
          assert "BUILD='VISION14.2-20260912-1842'" in s
          assert 'SITE38-VISION14_2-20260912-1842' in Path('journal-route-loader.js').read_text()
          assert Path('index.html').read_text().count('SITE38-VISION14_2-20260912-1842') == 2
          print('Vision foreground layer contract: ok')
          PY

      - name: Commit verified product changes
        run: |
          set -euo pipefail
          rm .github/workflows/vision-v14-layer-fix-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep Vision interactive art above tracking meshes"
          git push origin HEAD:fix/vision-v14-foreground-layer
