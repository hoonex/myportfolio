name: Temporary Vision v13.3 pinch repair

on:
  push:
    branches:
      - fix/vision-pinch-v13-3

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vision-pinch-v13-3
          fetch-depth: 0

      - name: Fix visible pinch and immediate contact
        shell: python
        run: |
          from pathlib import Path
          p=Path('journal-v13-vision.js')
          s=p.read_text()
          def rep(old,new):
              global s
              if old not in s:
                  raise SystemExit('missing expected source: '+old[:180])
              s=s.replace(old,new,1)

          rep(
            "screenPalm=(dist2(P[5],P[17])+dist2(P[0],P[9]))*.5,screenRatio=dist2(P[4],P[8])/Math.max(20,screenPalm)",
            "screenPalm=(dist2(P[5],P[17])+dist2(P[0],P[9]))*.5,screenGap=dist2(P[4],P[8]),contactPx=Math.max(18,screenPalm*.34),screenRatio=screenGap/Math.max(20,screenPalm)"
          )
          rep(
            "if(!st.on&&st.close>=2)st.on=true;",
            "if(!st.on&&(screenGap<=contactPx||worldRatio<.34||normRatio<.34||st.close>=2))st.on=true;"
          )
          rep(
            "quality:st.ema,a,b,screenRatio,normRatio,worldRatio",
            "quality:st.ema,a,b,gapPx:screenGap,thresholdPx:contactPx,screenRatio,normRatio,worldRatio"
          )
          old="function drawPinchFeedback(ctx,p,w){if(!p)return;ctx.save();ctx.lineCap='round';if(p.a&&p.b){ctx.strokeStyle=p.active?'rgba(255,255,255,.98)':'rgba(100,225,255,.48)';ctx.lineWidth=Math.max(2,w/420);ctx.beginPath();ctx.moveTo(p.a.x,p.a.y);ctx.lineTo(p.b.x,p.b.y);ctx.stroke()}let x=p.x*w,y=p.y*w,r=Math.max(8,w/88);ctx.fillStyle=p.active?'rgba(255,255,255,.96)':'rgba(73,210,255,.26)';ctx.strokeStyle=p.active?'rgba(90,235,255,.98)':'rgba(90,235,255,.62)';ctx.lineWidth=Math.max(2,w/520);ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore()}"
          new="function drawPinchFeedback(ctx,p,w,h){if(!p)return;ctx.save();ctx.lineCap='round';if(p.a&&p.b){ctx.strokeStyle=p.active?'rgba(255,255,255,.98)':'rgba(100,225,255,.48)';ctx.lineWidth=Math.max(2,w/420);ctx.beginPath();ctx.moveTo(p.a.x,p.a.y);ctx.lineTo(p.b.x,p.b.y);ctx.stroke()}let x=p.x*w,y=p.y*h,r=Math.max(9,w/84);ctx.fillStyle=p.active?'rgba(255,255,255,.96)':'rgba(73,210,255,.20)';ctx.strokeStyle=p.active?'rgba(90,235,255,.98)':'rgba(90,235,255,.55)';ctx.lineWidth=Math.max(2,w/520);ctx.shadowColor=p.active?'rgba(90,235,255,.95)':'transparent';ctx.shadowBlur=p.active?r*1.6:0;ctx.beginPath();ctx.arc(x,y,p.active?r*1.16:r,0,Math.PI*2);ctx.fill();ctx.stroke();if(p.active){ctx.shadowBlur=0;ctx.fillStyle='rgba(255,255,255,.98)';ctx.font=`700 ${Math.max(10,w/78)}px ui-monospace`;ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText('PINCH',x,y-r*1.45)}ctx.restore()}"
          rep(old,new)
          rep("drawPinchFeedback(ctx,p,w);", "drawPinchFeedback(ctx,p,w,h);")
          rep(
            "metric('pinch',p?`${p.side} · ${Math.round(p.quality*100)}%${p.active?' · PINCH':''}`:'--');",
            "metric('pinch',p?`${p.side} · ${p.gapPx.toFixed(0)}/${p.thresholdPx.toFixed(0)}px · ${Math.round(p.quality*100)}% · ${p.active?'PINCH':'OPEN'}`:'--');"
          )
          p.write_text(s)

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          node --check journal-v13-vision.js
          python - <<'PY'
          from pathlib import Path
          s=Path('journal-v13-vision.js').read_text()
          assert "screenGap=dist2(P[4],P[8])" in s
          assert "contactPx=Math.max(18,screenPalm*.34)" in s
          assert "screenGap<=contactPx||worldRatio<.34||normRatio<.34||st.close>=2" in s
          assert "function drawPinchFeedback(ctx,p,w,h)" in s
          assert "y=p.y*h" in s
          assert "fillText('PINCH'" in s
          assert "gapPx:screenGap,thresholdPx:contactPx" in s
          assert "drawPinchFeedback(ctx,p,w,h)" in s
          print('Vision pinch visible-contact contract: ok')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add journal-v13-vision.js
          git commit -m "fix: make Vision pinch immediate and visible"
          git push origin HEAD:fix/vision-pinch-v13-3
