<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vision Physical Camera Probe P3</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#050607;color:#f5f7fa;font-family:system-ui,-apple-system,sans-serif}body{min-height:100dvh;padding:16px}.wrap{max-width:560px;margin:auto}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.tag{font:700 12px/1 ui-monospace,monospace;color:#69ffb0;border:1px solid #2a8f60;padding:8px 10px;border-radius:999px}.stage{position:relative;width:100%;aspect-ratio:9/16;background:#111;border-radius:24px;overflow:hidden;border:1px solid #30343a}canvas{width:100%;height:100%;display:block;background:#111}.hud{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.box{background:#111418;border:1px solid #292f36;border-radius:14px;padding:10px;min-height:62px}.k{font:600 10px/1.2 ui-monospace,monospace;color:#9ba5af}.v{font:700 15px/1.35 ui-monospace,monospace;margin-top:6px;word-break:break-word}.wide{grid-column:1/-1}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}button{height:52px;border:0;border-radius:16px;font-weight:800;font-size:15px;background:#e9fff4;color:#07130d}button.secondary{background:#171b20;color:#eef3f7;border:1px solid #303740}button:disabled{opacity:.45}.err{color:#ff7777}.ok{color:#69ffb0}.warn{color:#ffd86b}.cal{margin-top:10px;background:#111418;border:1px solid #292f36;border-radius:14px;padding:12px}.calrow{display:flex;justify-content:space-between;align-items:center;gap:10px}.cal input{width:100%;margin-top:10px}video{position:fixed;left:-9999px;top:0;width:2px;height:2px;opacity:.01;pointer-events:none}</style>
</head>
<body><div class="wrap">
<div class="head"><div><b>Physical Camera Probe</b><div style="font-size:12px;color:#8f99a3;margin-top:4px">실제 getUserMedia · CPU IMAGE · frame locked</div></div><div class="tag">PROBE P3</div></div>
<div class="stage" id="stage"><canvas id="out"></canvas></div>
<div class="buttons"><button id="start" disabled>모델 준비 중…</button><button id="copy" class="secondary">숫자 진단 복사</button></div>
<div class="cal"><div class="calrow"><span class="k">MESH X CALIBRATION</span><strong id="calText">0.0%</strong></div><input id="xcal" type="range" min="-5" max="5" value="0" step="0.1"></div>
<div class="hud">
<div class="box"><div class="k">STATE</div><div class="v" id="state">boot</div></div>
<div class="box"><div class="k">CAMERA</div><div class="v" id="cam">--</div></div>
<div class="box"><div class="k">FACE</div><div class="v" id="face">--</div></div>
<div class="box"><div class="k">DETECT / INVALID</div><div class="v" id="runs">0 / 0</div></div>
<div class="box wide"><div class="k">LANDMARK #1 / BOX</div><div class="v" id="coord">--</div></div>
<div class="box wide"><div class="k">ERROR / RECOVERY</div><div class="v" id="error">none</div></div>
</div>
<video id="video" autoplay playsinline muted></video>
<canvas id="source" hidden></canvas>
</div>
<script type="module">
const VERSION='1.0.1', REV='P3-20260830-2148';
const MOD=`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VERSION}/vision_bundle.mjs`;
const WASM=`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VERSION}/wasm`;
const MODEL='https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
const $=id=>document.getElementById(id),video=$('video'),canvas=$('out'),ctx=canvas.getContext('2d',{alpha:false}),source=$('source'),sctx=source.getContext('2d',{alpha:false}),stage=$('stage'),start=$('start'),copy=$('copy'),xcal=$('xcal'),calText=$('calText');
let vision,fileset,faceTask,stream,running=false,lastDetect=0,detectRuns=0,invalid=0,recoveries=0,rebuilding=false,lastError='none',lastEdges=0,lastGoodRaw=null,xOffset=0;
const set=(id,v,cls='')=>{const n=$(id);n.textContent=v;n.className='v '+cls};
const finite=v=>Number.isFinite(v);
function recordError(e){lastError=`${e?.name||'Error'}: ${e?.message||e}`;set('error',`${lastError}\nrecovery=${recoveries}`,'err');console.error(e)}
function size(){const r=canvas.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1),w=Math.max(2,Math.round(r.width*d)),h=Math.max(2,Math.round(r.height*d));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}return{w,h}}
function ensureSource(){const vw=video.videoWidth,vh=video.videoHeight;if(!vw||!vh)return false;if(source.width!==vw||source.height!==vh){source.width=vw;source.height=vh;stage.style.aspectRatio=`${vw}/${vh}`;set('cam',`${vw}×${vh} · exact aspect`)}return true}
function project(p,w,h){return{x:(1-p.x)*w + xOffset*w,y:p.y*h}}
function path(links,P,color,width){ctx.beginPath();let count=0;for(const e of links||[]){const a=P[e.start??e[0]],b=P[e.end??e[1]];if(!a||!b||!finite(a.x)||!finite(a.y)||!finite(b.x)||!finite(b.y))continue;ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);count++}if(count){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}return count}
function drawLockedFrame(){const {w,h}=size();ctx.fillStyle='#080a0d';ctx.fillRect(0,0,w,h);if(!source.width||!source.height)return{w,h};ctx.save();ctx.translate(w,0);ctx.scale(-1,1);ctx.drawImage(source,0,0,w,h);ctx.restore();return{w,h}}
function renderLocked(lm){const {w,h}=drawLockedFrame();if(!lm?.length){set('face','0');set('coord','no face');return}const valid=lm.length>400&&lm.every(p=>finite(p.x)&&finite(p.y)&&finite(p.z));if(!valid){invalid++;set('runs',`${detectRuns} / ${invalid}`,'warn');set('face','INVALID LANDMARKS','err');return}const P=lm.map(p=>project(p,w,h)),F=vision.FaceLandmarker;
ctx.save();ctx.shadowColor='#00ff77';ctx.shadowBlur=Math.max(7,w/90);lastEdges=path(F.FACE_LANDMARKS_TESSELATION,P,'#00ff77',Math.max(3.5,w/120));ctx.shadowBlur=0;path(F.FACE_LANDMARKS_FACE_OVAL,P,'#ffffff',Math.max(5,w/95));path(F.FACE_LANDMARKS_LEFT_EYE,P,'#25d9ff',Math.max(5,w/100));path(F.FACE_LANDMARKS_RIGHT_EYE,P,'#25d9ff',Math.max(5,w/100));path(F.FACE_LANDMARKS_LIPS,P,'#ff4db8',Math.max(5,w/100));ctx.restore();
let minX=1e9,minY=1e9,maxX=-1,maxY=-1;for(const p of P){minX=Math.min(minX,p.x);minY=Math.min(minY,p.y);maxX=Math.max(maxX,p.x);maxY=Math.max(maxY,p.y)}if([minX,minY,maxX,maxY].every(finite)){ctx.strokeStyle='#ffea49';ctx.lineWidth=Math.max(4,w/100);ctx.strokeRect(minX,minY,maxX-minX,maxY-minY)}
const refs=[[1,'#ff3030',12],[33,'#00d5ff',10],[263,'#00d5ff',10],[61,'#ff4db8',10],[291,'#ff4db8',10],[152,'#fff54d',10]];for(const [i,c,r] of refs){const p=P[i];if(!p||!finite(p.x)||!finite(p.y))continue;ctx.fillStyle=c;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.stroke()}
const p=P[1];set('face',`${lm.length} pts / ${lastEdges} edges`,'ok');set('coord',`#1 ${p.x.toFixed(1)},${p.y.toFixed(1)} | box ${minX.toFixed(0)},${minY.toFixed(0)} → ${maxX.toFixed(0)},${maxY.toFixed(0)}`);set('runs',`${detectRuns} / ${invalid}`);
ctx.font=`800 ${Math.max(15,w/34)}px ui-monospace,monospace`;ctx.fillStyle='rgba(0,0,0,.82)';ctx.fillRect(12,12,Math.min(w-24,w*.9),Math.max(40,w/14));ctx.fillStyle='#8cffc7';ctx.fillText(`P3 FRAME-LOCK · ${lm.length} · ${lastEdges}`,24,12+Math.max(27,w/18))}
async function makeTask(){if(rebuilding)return;rebuilding=true;try{try{faceTask?.close?.()}catch{}faceTask=await vision.FaceLandmarker.createFromOptions(fileset,{baseOptions:{modelAssetPath:MODEL},runningMode:'IMAGE',numFaces:1,minFaceDetectionConfidence:.5,minFacePresenceConfidence:.5,minTrackingConfidence:.5});recoveries++;set('error',`none · recovery=${recoveries}`,'ok')}finally{rebuilding=false}}
async function recover(e){recordError(e);if(rebuilding)return;set('state','RECOVERING MODEL','warn');try{await makeTask();set('state','LIVE · FRAME LOCKED','ok')}catch(x){recordError(x);set('state','RECOVERY FAILED','err')}}
function loop(now){if(!running)return;if(faceTask&&!rebuilding&&video.readyState>=2&&now-lastDetect>=90&&ensureSource()){lastDetect=now;try{sctx.drawImage(video,0,0,source.width,source.height);const r=faceTask.detect(source);detectRuns++;set('runs',`${detectRuns} / ${invalid}`);const lm=r?.faceLandmarks?.[0];if(lm?.length){const valid=lm.length>400&&lm.every(p=>finite(p.x)&&finite(p.y)&&finite(p.z));if(valid){lastGoodRaw=lm;renderLocked(lm)}else{invalid++;set('runs',`${detectRuns} / ${invalid}`,'warn');drawLockedFrame()}}else{lastGoodRaw=null;drawLockedFrame();set('face','0');set('coord','no face')}}catch(e){invalid++;set('runs',`${detectRuns} / ${invalid}`,'warn');recover(e)}}requestAnimationFrame(loop)}
async function init(){try{set('state','loading model');vision=await import(MOD);fileset=await vision.FilesetResolver.forVisionTasks(WASM);await makeTask();recoveries=0;set('error','none','ok');set('state','model ready · CPU IMAGE','ok');start.disabled=false;start.textContent='실제 전면카메라 시작'}catch(e){recordError(e);set('state','MODEL ERROR','err')}}
start.addEventListener('click',async()=>{try{start.disabled=true;set('state','requesting camera');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'user'},width:{ideal:720},height:{ideal:1280},frameRate:{ideal:30,max:30}}});video.srcObject=stream;await video.play();ensureSource();set('state','LIVE · FRAME LOCKED','ok');running=true;requestAnimationFrame(loop);start.textContent='실행 중'}catch(e){start.disabled=false;recordError(e);set('state','CAMERA ERROR','err')}});
xcal.addEventListener('input',()=>{xOffset=Number(xcal.value)/100;calText.textContent=`${Number(xcal.value).toFixed(1)}%`;if(lastGoodRaw)renderLocked(lastGoodRaw)});
copy.addEventListener('click',async()=>{const text=[`Vision Probe ${REV}`,`state=${$('state').textContent}`,`camera=${$('cam').textContent}`,`face=${$('face').textContent}`,`detect_invalid=${$('runs').textContent}`,`x_cal=${calText.textContent}`,`coord=${$('coord').textContent}`,`error=${$('error').textContent}`].join('\n');try{await navigator.clipboard.writeText(text);copy.textContent='복사됨';setTimeout(()=>copy.textContent='숫자 진단 복사',1200)}catch{copy.textContent='복사 실패'}});
addEventListener('beforeunload',()=>stream?.getTracks().forEach(t=>t.stop()));init();
</script></body></html>
