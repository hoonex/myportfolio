name: Fix Vision composite once
on:
  push:
    branches: [feat/design-journal-liquid-glass-20260827]
    paths: [.github/workflows/fix-vision-composite-once.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/design-journal-liquid-glass-20260827
          fetch-depth: 0
      - run: python .github/scripts/patch-vision-composite.py
      - run: |
          rm .github/workflows/fix-vision-composite-once.yml .github/scripts/patch-vision-composite.py
          git config user.name hoonex
          git config user.email 163626004+hoonex@users.noreply.github.com
          git add site/journal-v11-vision.js site/journal-v11-vision.css .github/scripts/design-journal-vision-model-preflight.mjs .github/workflows/fix-vision-composite-once.yml .github/scripts/patch-vision-composite.py
          git commit -m 'fix: composite camera and face mesh on one canvas'
          git push origin HEAD:feat/design-journal-liquid-glass-20260827
