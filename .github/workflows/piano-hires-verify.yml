name: Liquid Piano hires verify

on:
  push:
    branches:
      - fix/liquid-piano-resolution

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify hires runtime
        run: |
          set -euo pipefail
          node --check journal-v28-piano-state.js
          node --check journal-route-loader.js
          grep -q "mobilePx:340000" journal-v28-piano-state.js
          grep -q "mobileDpr:1" journal-v28-piano-state.js
          grep -q "mobileDpr:1.3" journal-v28-piano-state.js
          grep -q "mobileDpr:1.65" journal-v28-piano-state.js
          grep -q "quality:COARSE?'balanced':'balanced'" journal-v28-piano-state.js
          grep -q "SITE53-LIQUIDPIANO5-HIRES-20260916-1044" journal-route-loader.js
          echo "hires checks ok"
