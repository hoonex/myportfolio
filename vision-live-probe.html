<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="color-scheme" content="only light"><meta name="theme-color" content="#f5f5f2"><title>Face Rate P16</title><style>html,body{margin:0;background:#000;color:#fff;font-family:system-ui,sans-serif}#boot{padding:28px;font-size:18px;white-space:pre-wrap}</style></head><body><div id="boot">Face Rate P16 불러오는 중…</div><script>window.__p16parts=[];</script><script src="./p16/chunk0.js?v=160"></script><script src="./p16/chunk1.js?v=160"></script><script src="./p16/chunk2.js?v=160"></script><script src="./p16/chunk3.js?v=160"></script><script src="./p16/chunk4.js?v=160"></script><script src="./p16/chunk5.js?v=160"></script><script>(async()=>{try{if(typeof DecompressionStream==='undefined')throw new Error('이 브라우저는 DecompressionStream을 지원하지 않습니다.');if(!window.__p16parts||window.__p16parts.length!==6||window.__p16parts.some(x=>!x))throw new Error('P16 payload chunk missing');const b=window.__p16parts.join(''),bin=atob(b),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const html=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('boot').textContent='P16 load error\n'+String(e)}})();</script></body></html>
