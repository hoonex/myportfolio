name: Diagnose Vision v14 generated source

on:
  push:
    branches:
      - feat/vision-v14-interactive-art

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vision-v14-interactive-art
          fetch-depth: 0
      - name: Generate source
        run: |
          sed -i 's/a.length?.55:0/a.length ? .55 : 0/' .github/vision-v14-patch.py
          python .github/vision-v14-patch.py
      - name: Inspect parser boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('journal-v14-vision.js').read_text()
          lines=s.splitlines()
          for i in range(48,64):
              if i <= len(lines):
                  print(f'{i:03}: {lines[i-1]!r}')
          print('TOTAL_BACKTICKS', s.count('`'), 'PARITY', s.count('`') % 2)
          bal=0
          for i,line in enumerate(lines,1):
              bal ^= (line.count('`') & 1)
              if 45 <= i <= 64:
                  print('BT',i,line.count('`'),'OPEN',bal)
          PY
          node --check journal-v14-vision.js || true
