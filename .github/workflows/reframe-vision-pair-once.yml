name: Reframe Vision pair once

on:
  push:
    branches:
      - feat/design-journal-liquid-glass-20260827
    paths:
      - '.github/workflows/reframe-vision-pair-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/design-journal-liquid-glass-20260827
          fetch-depth: 0
      - name: Reframe camera and 3D as a shared portrait pair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('site/journal-v11-vision.css')
          s = p.read_text()
          replacements = [
              ('.vision-grid-v11{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(310px,.72fr);gap:18px;align-items:start}', '.vision-grid-v11{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}'),
              ('.vision-camera-card-v11{padding:12px}', '.vision-camera-card-v11{padding:12px}.vision-camera-card-v11::before{content:"CAMERA / 2D";display:flex;align-items:center;height:14px;padding:4px 4px 10px;font:600 .68rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}'),
              ('aspect-ratio:var(--vision-aspect,16/9);overflow:hidden;border-radius:24px', 'aspect-ratio:3/4;overflow:hidden;border-radius:24px'),
              ('.vision-side-v11{display:grid;gap:18px;position:sticky;top:170px}', '.vision-side-v11{display:contents}'),
              ('.vision-3d-card-v11 canvas{display:block;width:100%;aspect-ratio:1;', '.vision-3d-card-v11 canvas{display:block;width:100%;aspect-ratio:3/4;'),
              ('.vision-hud-v11{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));', '.vision-hud-v11{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));'),
              ('.vision-grid-v11{grid-template-columns:1fr}.vision-side-v11{position:static;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}', '.vision-grid-v11{grid-template-columns:repeat(2,minmax(0,1fr))}.vision-side-v11{display:contents}'),
              ('.vision-camera-card-v11{padding:8px}', '.vision-camera-card-v11,.vision-3d-card-v11{padding:8px}'),
              ('.vision-side-v11{grid-template-columns:1fr}.vision-3d-card-v11 canvas{aspect-ratio:1.3}', '.vision-side-v11{display:contents}.vision-3d-card-v11 canvas{aspect-ratio:3/4}'),
              ('.vision-stage-v11{border-radius:18px}', '.vision-stage-v11{border-radius:18px}.vision-stage-watermark-v11{left:10px;top:10px}.vision-stage-watermark-v11 b{display:none}.vision-card-head-v11,.vision-camera-card-v11::before{font-size:.56rem;letter-spacing:.03em}')
          ]
          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'anchor count {count}: {old[:100]}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          python .github/scripts/validate-runtime.py
          git diff --check
      - name: Commit pair layout and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/reframe-vision-pair-once.yml
          git add site/journal-v11-vision.css
          git commit -m "fix: pair Vision camera and 3D panes"
          git push origin HEAD:feat/design-journal-liquid-glass-20260827
