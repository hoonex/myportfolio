name: Apply Vision v14 layer order fix

on:
  push:
    branches:
      - fix/vision-v14-layer-order

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vision-v14-layer-order
          fetch-depth: 0
      - name: Put interactive art above face mesh
        run: |
          python - <<'PY'
          from pathlib import Path

          js = Path('journal-v14-vision.js')
          s = js.read_text()
          old = "updateArt(dt,ps,F,w,h,now);drawArt(ctx,w,h,ps,F,now);drawFace(ctx,F,w,h);H.forEach((x,i)=>drawHand(ctx,x,i,w));drawPinchFeedback(ctx,ps,w,h);"
          new = "updateArt(dt,ps,F,w,h,now);drawFace(ctx,F,w,h);drawArt(ctx,w,h,ps,F,now);H.forEach((x,i)=>drawHand(ctx,x,i,w));drawPinchFeedback(ctx,ps,w,h);"
          if old not in s:
              raise SystemExit('expected Vision v14 render order not found')
          s = s.replace(old, new, 1)
          s = s.replace("BUILD='VISION14-20260912-1252'", "BUILD='VISION14.1-20260912-1650'", 1)
          js.write_text(s)

          old_rev = 'SITE36-VISION14-20260912-1252'
          new_rev = 'SITE37-VISION14_1-20260912-1650'
          for name in ('journal-route-loader.js', 'index.html'):
              p = Path(name)
              t = p.read_text()
              if old_rev not in t:
                  raise SystemExit(f'{old_rev} not found in {name}')
              p.write_text(t.replace(old_rev, new_rev))
          PY
      - name: Verify layer contract
        run: |
          set -euo pipefail
          node --check journal-v14-vision.js
          node --check journal-route-loader.js
          python - <<'PY'
          from pathlib import Path
          s = Path('journal-v14-vision.js').read_text()
          assert "BUILD='VISION14.1-20260912-1650'" in s
          anchor = s.index('updateArt(dt,ps,F,w,h,now);')
          chunk = s[anchor:anchor+420]
          face = chunk.index('drawFace(ctx,F,w,h)')
          art = chunk.index('drawArt(ctx,w,h,ps,F,now)')
          hand = chunk.index('H.forEach((x,i)=>drawHand(ctx,x,i,w))')
          pinch = chunk.index('drawPinchFeedback(ctx,ps,w,h)')
          assert face < art < hand < pinch, (face, art, hand, pinch)
          rev='SITE37-VISION14_1-20260912-1650'
          assert rev in Path('journal-route-loader.js').read_text()
          assert Path('index.html').read_text().count(rev) == 2
          print('Vision layer order: camera < face < art < hand < pinch')
          PY
      - name: Commit verified product change
        run: |
          rm .github/workflows/vision-v14-layer-fix-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: render Vision art above face mesh"
          git push origin HEAD:fix/vision-v14-layer-order
