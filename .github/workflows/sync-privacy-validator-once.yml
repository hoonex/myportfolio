name: Sync privacy validator once

on:
  push:
    branches:
      - feat/design-journal-liquid-glass-20260827
    paths:
      - '.github/workflows/sync-privacy-validator-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/design-journal-liquid-glass-20260827
          fetch-depth: 0
      - name: Align privacy validator with canonical copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/validate-runtime.py')
          text = path.read_text()
          old = 'MediaPipe API performance or utilization metrics may be sent to Google.'
          new = 'MediaPipe API performance or usage metrics may be sent to Google.'
          if text.count(old) != 1:
              raise SystemExit(f'unexpected old privacy validator phrase count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          python .github/scripts/validate-runtime.py
          git diff --check
      - name: Commit validator sync and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sync-privacy-validator-once.yml
          git add .github/scripts/validate-runtime.py
          git commit -m "test: align Vision privacy validator wording"
          git push origin HEAD:feat/design-journal-liquid-glass-20260827
