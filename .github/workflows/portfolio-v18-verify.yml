name: Portfolio v18 verify

on:
  push:
    branches:
      - feat/portfolio-latest-auto-sync

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify portfolio runtime and snapshot model
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --check portfolio-v18-content.js
          node --check portfolio-v18.js
          node --check scripts/sync-portfolio.mjs
          node scripts/sync-portfolio.mjs --validate
          cp portfolio-snapshots.json /tmp/portfolio-snapshots.before.json
          node scripts/sync-portfolio.mjs --write
          node scripts/sync-portfolio.mjs --validate
          python3 - <<'PY'
          from pathlib import Path
          import json
          index = Path('index.html').read_text()
          assert 'portfolio-v18-content.js' in index
          assert 'portfolio-v18.js' in index
          assert 'portfolio-v18.css' in index
          assert 'portfolio-v15.js' not in index
          assert 'portfolio-v16-projects.js' not in index
          assert 'portfolio-v17-repo-projects.js' not in index
          assert 'SITE54-PORTFOLIO18-AUTO-20260916' in index
          sources = json.loads(Path('portfolio-sources.json').read_text())
          snaps = json.loads(Path('portfolio-snapshots.json').read_text())
          assert set(sources['projects']) == set(snaps['projects'])
          content = Path('portfolio-v18-content.js').read_text()
          for key in ['adofai','aeroforge','sloar','liquid-piano','daily-tech','esp32-car','nightshift','vision','glass-lab']:
              assert key in content
          renderer = Path('portfolio-v18.js').read_text()
          assert "querySelectorAll('[data-current-work-v18]')" in renderer
          assert "dataset.projectPageV18" in renderer
          sync = Path('scripts/sync-portfolio.mjs').read_text()
          assert 'encodeURIComponent(ref)' in sync
          print('portfolio v18 invariants ok')
          PY
          git diff -- portfolio-snapshots.json || true
