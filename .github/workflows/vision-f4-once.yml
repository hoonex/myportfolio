name: Vision F4 single canvas once
on:
  push:
    branches: [feat/design-journal-liquid-glass-20260827]
    paths: ['.github/workflows/vision-f4-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/design-journal-liquid-glass-20260827
          fetch-depth: 0
      - name: Apply F4 single-canvas compositor
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/patch-vision-f4-single-canvas.py
          rm .github/scripts/patch-vision-f4-single-canvas.py
          rm .github/workflows/vision-f4-once.yml
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name hoonex
          git config user.email '163626004+hoonex@users.noreply.github.com'
          git add -A
          git commit -m 'fix: composite Vision camera and mesh on one canvas F4'
          git pull --rebase origin feat/design-journal-liquid-glass-20260827
          git push origin HEAD:feat/design-journal-liquid-glass-20260827
