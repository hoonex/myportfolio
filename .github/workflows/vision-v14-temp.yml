name: Temporary Vision v14 interactive art upgrade

on:
  push:
    branches:
      - feat/vision-v14-interactive-art

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vision-v14-interactive-art
          fetch-depth: 0

      - name: Build Vision v14 interactive art runtime
        shell: python
        run: |
          from pathlib import Path
          import re, json

          p=Path('journal-v13-vision.js')
          s=p.read_text()

          def sub(pattern,repl,count=1,flags=re.S):
              global s
              n=0
              s2,n=re.subn(pattern,repl,s,count=count,flags=flags)
              if n!=count:
                  raise SystemExit(f'pattern replacement count {n} != {count}: {pattern[:120]}')
              s=s2

          s=s.replace('/* Vision Lab v13.7 — stable face shell + continuous opaque hand skin. */','/* Vision Lab v14 — dual-hand interactive art playground. */',1)
          s=s.replace("const R='/lab/vision',MPV='1.0.1',BUILD='VISION13.7-20260912-1247';","const R='/lab/vision',MPV='1.0.1',BUILD='VISION14-20260912-1252';",1)

          sub(r"let state=\{surface:true,wire:false,debug:false,play:true\},orbs=\[\],grab=null,lastPinch=null,faceTriangles=null,pinchState=new Map\(\);",
              "let state={surface:true,wire:false,debug:false,play:true,mode:'orbit'},orbs=[],grabs=new Map(),lastPinches=new Map(),faceTriangles=null,pinchState=new Map(),trails=new Map(),ripples=[],field=[],sculpt={energy:0};")

          new_markup=r'''function markup(){let c=T(),tg=(k,l,on)=>`<label class="v13-toggle"><input type="checkbox" data-v13-toggle="${k}" ${on?'checked':''}><span>${l}</span></label>`;return `<div class="v13-page v14-page" data-v13-root data-lang="${lang()}"><header class="v14-hero"><span>VISION / INTERACTIVE ART</span><div><h1>Move.<br>Shape.<br>Play.</h1><p>${c.lead}</p></div></header><section class="v14-shell"><div class="v14-toolbar"><div class="v13-actions"><button class="v13-primary" data-v13-start>${c.start}</button><button data-v13-stop disabled>${c.stop}</button><button data-v13-flip>${c.flip}</button></div><div class="v14-view">${tg('surface',c.surface,1)}${tg('wire',c.wire,0)}${tg('debug',c.debug,0)}</div><div class="v13-status"><i></i><span data-v13-status>${c.idle}</span></div></div><section class="v13-stage-card v14-stage-card"><div class="v13-stage v14-stage" data-v13-stage><video data-v13-video playsinline muted></video><canvas data-v13-canvas></canvas><div class="v14-modebar" role="tablist" aria-label="Interactive art mode"><button type="button" data-v14-mode="orbit" aria-selected="true">Orbit</button><button type="button" data-v14-mode="threads">Threads</button><button type="button" data-v14-mode="bloom">Bloom</button><button type="button" data-v14-mode="sculpt">Sculpt</button></div><button class="v14-full" type="button" data-v14-full aria-label="전체화면">↗</button><div class="v14-caption"><b data-v14-mode-title>Orbit</b><span data-v14-mode-copy>양손으로 각각 다른 구체를 동시에 집고 던지세요.</span></div></div></section><div class="v14-statusrail"><span data-v13-face-state>FACE MODEL</span><span data-v13-hand-state>HAND MODEL</span><span data-v13-metric="gesture">None</span><span data-v13-metric="pinch">--</span></div><details class="v14-diagnostics"><summary>Diagnostics</summary><div class="v13-metrics">${[['fps','FPS'],['infer','INFERENCE'],['hands','HANDS'],['face','FACE']].map(([k,l])=>`<article><span>${l}</span><strong data-v13-metric="${k}">--</strong></article>`).join('')}</div></details></section></div>`}'''
          sub(r"function markup\(\)\{.*?\}\nfunction nav",new_markup+"\nfunction nav")

          new_seed=r'''function seed(){orbs=[{x:.18,y:.25,r:.035,vx:.05,vy:.01,h:205},{x:.42,y:.28,r:.045,vx:-.03,vy:.02,h:154},{x:.72,y:.24,r:.032,vx:-.04,vy:.03,h:35},{x:.28,y:.68,r:.042,vx:.03,vy:-.02,h:285},{x:.56,y:.72,r:.034,vx:-.04,vy:.02,h:55},{x:.78,y:.62,r:.048,vx:.02,vy:-.03,h:190}];grabs.clear();lastPinches.clear();pinchState.clear();trails.clear();ripples=[];field=Array.from({length:72},(_,i)=>({x:(.11+i*.61803398875)%1,y:(.17+i*.41421356237)%1,vx:0,vy:0,h:(188+i*3.1)%360}));sculpt.energy=0}'''
          sub(r"function seed\(\)\{.*?\}\nfunction mount",new_seed+"\nfunction mount")

          new_bind=r'''function bind(){q('[data-v13-start]')?.addEventListener('click',start);q('[data-v13-stop]')?.addEventListener('click',stop);q('[data-v13-flip]')?.addEventListener('click',async()=>{facing=facing==='user'?'environment':'user';if(running){stopStream();running=false;cancelFrame();await start()}});qa('[data-v13-toggle]').forEach(n=>n.addEventListener('change',e=>{state[e.currentTarget.dataset.v13Toggle]=e.currentTarget.checked;draw(performance.now(),true)}));qa('[data-v14-mode]').forEach(n=>n.addEventListener('click',()=>setMode(n.dataset.v14Mode)));q('[data-v14-full]')?.addEventListener('click',toggleFull);ro?.disconnect();ro=new ResizeObserver(()=>draw(performance.now(),true));ro.observe(q('[data-v13-stage]'));syncModeUI()}
const ART={orbit:['Orbit','양손으로 각각 다른 구체를 동시에 집고 던지세요.'],threads:['Threads','두 손으로 빛의 선을 그리고, 동시에 집으면 두 선이 연결됩니다.'],bloom:['Bloom','손과 얼굴의 움직임으로 입자와 파동을 밀어내세요.'],sculpt:['Sculpt','두 핀치 사이의 형태를 늘리고 비틀어 보세요.']};
function clearArtInteraction(){grabs.clear();lastPinches.clear();trails.clear();ripples=[];sculpt.energy=0}
function setMode(mode){if(!ART[mode]||state.mode===mode)return;state.mode=mode;clearArtInteraction();syncModeUI();draw(performance.now(),true)}
function syncModeUI(){qa('[data-v14-mode]').forEach(n=>{let on=n.dataset.v14Mode===state.mode;n.classList.toggle('active',on);n.setAttribute('aria-selected',on?'true':'false')});let a=ART[state.mode]||ART.orbit,b=q('[data-v14-mode-title]'),c=q('[data-v14-mode-copy]');if(b)b.textContent=a[0];if(c)c.textContent=a[1]}
async function toggleFull(){let stage=q('[data-v13-stage]');try{if(document.fullscreenElement)await document.exitFullscreen();else await stage?.requestFullscreen?.()}catch(e){console.warn('[Vision14] fullscreen unavailable',e)}}'''
          sub(r"function bind\(\)\{.*?\}\nfunction status",new_bind+"\nfunction status")

          new_pinch=r'''function pinches(NH,H,handed,world,w,h){let live=new Set(),out=[];for(let i=0;i<NH.length;i++){let N=NH[i],P=H[i]?.P,W=world?.[i];if(!N?.[4]||!N?.[8]||!P?.[4]||!P?.[8])continue;let side=handed?.[i]?.[0]?.categoryName||handed?.[i]?.[0]?.displayName||`H${i+1}`,key=side;live.add(key);let screenPalm=(dist2(P[5],P[17])+dist2(P[0],P[9]))*.5,screenGap=dist2(P[4],P[8]),contactPx=Math.max(18,screenPalm*.34),screenRatio=screenGap/Math.max(20,screenPalm),normPalm=(dist2(N[5],N[17])+dist2(N[0],N[9]))*.5,normRatio=dist2(N[4],N[8])/Math.max(.035,normPalm),worldPalm=W?.[5]&&W?.[17]?(dist3(W[5],W[17])+dist3(W[0],W[9]))*.5:0,worldRatio=worldPalm?dist3(W[4],W[8])/Math.max(.015,worldPalm):99,ratio=Math.min(screenRatio,normRatio,worldRatio),instant=clamp(1-(ratio-.16)/.58,0,1),st=pinchState.get(key)||{ema:instant,on:false,close:0,open:0};st.ema=st.ema*.55+instant*.45;let closing=st.ema>.50||screenRatio<.46||normRatio<.46||worldRatio<.48,opening=st.ema<.27&&screenRatio>.66&&normRatio>.66&&(worldRatio===99||worldRatio>.64);st.close=closing?st.close+1:0;st.open=opening?st.open+1:0;if(!st.on&&(screenGap<=contactPx||worldRatio<.34||normRatio<.34||st.close>=2))st.on=true;if(st.on&&st.open>=2)st.on=false;pinchState.set(key,st);let a=P[4],b=P[8];out.push({key,active:st.on,x:(a.x+b.x)/(2*w),y:(a.y+b.y)/(2*h),ratio,side,quality:st.ema,a,b,gapPx:screenGap,thresholdPx:contactPx,screenRatio,normRatio,worldRatio})}for(let key of [...pinchState.keys()])if(!live.has(key))pinchState.delete(key);return out.sort((a,b)=>a.side.localeCompare(b.side))}
function gestureLabel(ps,hands){if(!hands.length)return'None';let n=ps.filter(p=>p.active).length;if(n)return n===1?`Pinch · ${ps.find(p=>p.active)?.side||''}`:`Pinch ×${n}`;return hands.length>1?'Tracking ×2':'Tracking'}'''
          sub(r"function pinch\(NH,H,handed,world,w,h\)\{.*?\}\nfunction gestureLabel\(p,hands\)\{.*?\}",new_pinch)

          new_art=r'''function activeMap(ps){return new Map(ps.filter(p=>p.active).map(p=>[p.key,p]))}
function updateOrbit(dt,ps,F,w,h,now){let active=activeMap(ps),held=new Set(grabs.values());for(let o of orbs)if(!held.has(o)){o.vy+=.025*dt;o.x+=o.vx*dt;o.y+=o.vy*dt;let r=o.r;if(o.x<r){o.x=r;o.vx=Math.abs(o.vx)*.78}if(o.x>1-r){o.x=1-r;o.vx=-Math.abs(o.vx)*.78}if(o.y<r){o.y=r;o.vy=Math.abs(o.vy)*.78}if(o.y>1-r){o.y=1-r;o.vy=-Math.abs(o.vy)*.72;o.vx*=.985}o.vx*=Math.pow(.993,dt*60)}for(let [key,p] of active){let o=grabs.get(key);if(!o){let d=.14;for(let x of orbs)if(!held.has(x)){let k=hypot(x.x-p.x,x.y-p.y);if(k<d){d=k;o=x}}if(o){grabs.set(key,o);held.add(o)}}if(o){let prev=lastPinches.get(key),d=Math.max(.008,dt);if(prev){o.vx=(p.x-prev.x)/d;o.vy=(p.y-prev.y)/d}o.x=p.x;o.y=p.y}lastPinches.set(key,{x:p.x,y:p.y})}for(let key of [...grabs.keys()])if(!active.has(key)){let o=grabs.get(key);if(o){o.vx=clamp(o.vx,-1.5,1.5);o.vy=clamp(o.vy,-1.5,1.5)}grabs.delete(key);lastPinches.delete(key)}if(blend('jawOpen')>.47&&F?.center&&now-lastBurst>520){let fx=F.center.x/w,fy=F.center.y/h;for(let o of orbs){let dx=o.x-fx,dy=o.y-fy,d=Math.max(.05,hypot(dx,dy)),f=.34/d;o.vx+=dx/d*f;o.vy+=dy/d*f}lastBurst=now}}
function updateThreads(dt,ps,now){let live=new Set();for(let p of ps){live.add(p.key);let t=trails.get(p.key)||[];if(p.active){let last=t[t.length-1];if(!last||hypot(last.x-p.x,last.y-p.y)>.004)t.push({x:p.x,y:p.y,t:now});if(t.length>110)t.splice(0,t.length-110)}else while(t.length&&now-t[0].t>3600)t.shift();trails.set(p.key,t)}for(let [key,t] of trails){while(t.length&&now-t[0].t>4200)t.shift();if(!live.has(key)&&!t.length)trails.delete(key)}}
function updateBloom(dt,ps,F,w,h,now){let active=ps.filter(p=>p.active),fc=F?.center?{x:F.center.x/w,y:F.center.y/h}:null,j=blend('jawOpen');for(let o of field){let ax=(.5-o.x)*.008,ay=(.5-o.y)*.008;for(let p of active){let dx=o.x-p.x,dy=o.y-p.y,d2=Math.max(.002,dx*dx+dy*dy),f=.00042/d2;ax+=dx*f;ay+=dy*f}if(fc&&j>.18){let dx=o.x-fc.x,dy=o.y-fc.y,d2=Math.max(.003,dx*dx+dy*dy),f=j*.0002/d2;ax+=dx*f;ay+=dy*f}o.vx=(o.vx+ax)*.97;o.vy=(o.vy+ay)*.97;o.x+=o.vx;o.y+=o.vy;if(o.x<0||o.x>1)o.vx*=-.8;if(o.y<0||o.y>1)o.vy*=-.8;o.x=clamp(o.x,0,1);o.y=clamp(o.y,0,1)}if(fc&&j>.48&&now-lastBurst>380){ripples.push({x:fc.x,y:fc.y,r:.02,a:1,h:196});lastBurst=now}for(let p of active){let prev=lastPinches.get(p.key);if(!prev){ripples.push({x:p.x,y:p.y,r:.012,a:.75,h:p.side==='Left'?198:318})}lastPinches.set(p.key,{x:p.x,y:p.y})}let activeKeys=new Set(active.map(p=>p.key));for(let key of [...lastPinches.keys()])if(!activeKeys.has(key))lastPinches.delete(key);for(let r of ripples){r.r+=dt*.34;r.a-=dt*.42}ripples=ripples.filter(r=>r.a>0&&r.r<.65)}
function updateSculpt(dt,ps){let a=ps.filter(p=>p.active);let target=a.length>1?1:a.length?.55:0;sculpt.energy+= (target-sculpt.energy)*Math.min(1,dt*8)}
function updateArt(dt,ps,F,w,h,now){if(!state.play)return;if(state.mode==='orbit')updateOrbit(dt,ps,F,w,h,now);else if(state.mode==='threads')updateThreads(dt,ps,now);else if(state.mode==='bloom')updateBloom(dt,ps,F,w,h,now);else updateSculpt(dt,ps)}
function drawPinchFeedback(ctx,ps,w,h){for(let p of ps){if(!p.active)continue;ctx.save();ctx.lineCap='round';if(p.a&&p.b){ctx.strokeStyle='rgba(255,255,255,.92)';ctx.lineWidth=Math.max(1.5,w/520);ctx.beginPath();ctx.moveTo(p.a.x,p.a.y);ctx.lineTo(p.b.x,p.b.y);ctx.stroke()}let x=p.x*w,y=p.y*h,r=Math.max(8,w/105);ctx.strokeStyle='rgba(255,255,255,.94)';ctx.lineWidth=Math.max(1.5,w/620);ctx.shadowColor=p.side==='Left'?'rgba(84,214,255,.9)':'rgba(255,104,214,.82)';ctx.shadowBlur=r*1.2;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();ctx.restore()}}
function drawOrbs(ctx,w,h){ctx.save();for(let o of orbs){let x=o.x*w,y=o.y*h,r=o.r*Math.min(w,h),g=ctx.createRadialGradient(x-r*.35,y-r*.42,r*.08,x,y,r);g.addColorStop(0,'rgba(255,255,255,.96)');g.addColorStop(.2,`hsla(${o.h} 94% 72% / .88)`);g.addColorStop(1,`hsla(${o.h} 90% 48% / .3)`);ctx.fillStyle=g;ctx.shadowColor=`hsla(${o.h} 100% 66% / .32)`;ctx.shadowBlur=r*.65;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}ctx.restore()}
function drawThreads(ctx,w,h,ps,now){ctx.save();ctx.globalCompositeOperation='lighter';let n=0;for(let [key,t] of trails){if(t.length<2)continue;let hue=key==='Left'?196:318;ctx.beginPath();for(let i=0;i<t.length;i++){let p=t[i],x=p.x*w,y=p.y*h;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.strokeStyle=`hsla(${hue} 100% 68% / .72)`;ctx.lineWidth=Math.max(2,w/170);ctx.lineCap='round';ctx.lineJoin='round';ctx.shadowColor=`hsla(${hue} 100% 64% / .75)`;ctx.shadowBlur=Math.max(8,w/55);ctx.stroke();n++}let a=ps.filter(p=>p.active);if(a.length>=2){let A=a[0],B=a[1],mx=(A.x+B.x)*w*.5,my=(A.y+B.y)*h*.5;ctx.beginPath();ctx.moveTo(A.x*w,A.y*h);ctx.quadraticCurveTo(mx,my-Math.min(w,h)*.08,B.x*w,B.y*h);ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=Math.max(2.5,w/145);ctx.shadowColor='rgba(120,210,255,.8)';ctx.shadowBlur=Math.max(10,w/45);ctx.stroke()}ctx.restore()}
function drawBloom(ctx,w,h,F){ctx.save();ctx.globalCompositeOperation='lighter';for(let o of field){let r=Math.max(1.8,w/430);ctx.fillStyle=`hsla(${o.h} 92% 68% / .62)`;ctx.beginPath();ctx.arc(o.x*w,o.y*h,r,0,Math.PI*2);ctx.fill()}for(let r of ripples){ctx.strokeStyle=`hsla(${r.h} 100% 72% / ${r.a})`;ctx.lineWidth=Math.max(1.3,w/700);ctx.beginPath();ctx.arc(r.x*w,r.y*h,r.r*Math.min(w,h),0,Math.PI*2);ctx.stroke()}ctx.restore()}
function drawSculpt(ctx,w,h,ps,F){let a=ps.filter(p=>p.active),A=a[0],B=a[1];if(!A&&!F?.center)return;let ax=(A?.x??F.center.x/w)*w,ay=(A?.y??F.center.y/h)*h;if(!B){let r=Math.min(w,h)*(.075+.035*sculpt.energy),g=ctx.createRadialGradient(ax-r*.3,ay-r*.35,r*.05,ax,ay,r);g.addColorStop(0,'rgba(255,255,255,.96)');g.addColorStop(.28,'rgba(82,211,255,.72)');g.addColorStop(1,'rgba(84,90,255,.22)');ctx.save();ctx.fillStyle=g;ctx.shadowColor='rgba(82,180,255,.5)';ctx.shadowBlur=r*.55;ctx.beginPath();ctx.arc(ax,ay,r,0,Math.PI*2);ctx.fill();ctx.restore();return}let bx=B.x*w,by=B.y*h,dx=bx-ax,dy=by-ay,d=Math.max(1,Math.hypot(dx,dy)),nx=-dy/d,ny=dx/d,r=Math.min(w,h)*clamp(.085-d/Math.max(w,h)*.035,.04,.085),bend=Math.sin((A.x+B.y)*8)*r*.35,cp1x=ax+dx*.34+nx*bend,cp1y=ay+dy*.34+ny*bend,cp2x=ax+dx*.66-nx*bend,cp2y=ay+dy*.66-ny*bend;ctx.save();let g=ctx.createLinearGradient(ax,ay,bx,by);g.addColorStop(0,'rgba(63,214,255,.88)');g.addColorStop(.52,'rgba(116,112,255,.78)');g.addColorStop(1,'rgba(255,88,202,.8)');ctx.fillStyle=g;ctx.shadowColor='rgba(117,136,255,.58)';ctx.shadowBlur=Math.max(18,w/32);ctx.beginPath();ctx.moveTo(ax+nx*r,ay+ny*r);ctx.bezierCurveTo(cp1x+nx*r,cp1y+ny*r,cp2x+nx*r,cp2y+ny*r,bx+nx*r,by+ny*r);ctx.arc(bx,by,r,Math.atan2(ny,nx),Math.atan2(-ny,-nx));ctx.bezierCurveTo(cp2x-nx*r,cp2y-ny*r,cp1x-nx*r,cp1y-ny*r,ax-nx*r,ay-ny*r);ctx.arc(ax,ay,r,Math.atan2(-ny,-nx),Math.atan2(ny,nx));ctx.fill();ctx.restore()}
function drawArt(ctx,w,h,ps,F,now){if(!state.play)return;if(state.mode==='orbit')drawOrbs(ctx,w,h);else if(state.mode==='threads')drawThreads(ctx,w,h,ps,now);else if(state.mode==='bloom')drawBloom(ctx,w,h,F);else drawSculpt(ctx,w,h,ps,F)}'''
          sub(r"function updatePlay\(dt,p,F,w,h,now\)\{.*?\}\nfunction drawPinchFeedback\(ctx,p,w,h\)\{.*?\}\nfunction drawOrbs\(ctx,w,h,p\)\{.*?\}\nfunction draw\(now=performance.now\(\),force=false\)",new_art+"\nfunction draw(now=performance.now(),force=false)")

          new_draw=r'''function draw(now=performance.now(),force=false){let c=q('[data-v13-canvas]'),v=q('[data-v13-video]');if(!c||!v)return;let {w,h}=size(c),ctx=c.getContext('2d',{alpha:false,desynchronized:true}),g=cover(v,w,h),m=facing==='user';ctx.save();ctx.fillStyle='#05070b';ctx.fillRect(0,0,w,h);if(g){if(m){ctx.translate(w,0);ctx.scale(-1,1)}ctx.drawImage(v,g.dx,g.dy,g.rw,g.rh)}ctx.restore();if(!g){ctx.fillStyle='rgba(255,255,255,.35)';ctx.font=`600 ${Math.max(12,w/45)}px ui-monospace`;ctx.textAlign='center';ctx.fillText('VISION / READY',w/2,h/2);return}let faces=face?.faceLandmarks||[],hands=hand?.landmarks||[],F=faces[0]?faceProjected(faces[0],g,w,m):null,H=hands.map(a=>handProjected(a,g,w,m)),ps=pinches(hands,H,hand?.handedness||hand?.handednesses||[],hand?.worldLandmarks||[],w,h),dt=lastDraw?(now-lastDraw)/1000:1/60;lastDraw=now;updateArt(dt,ps,F,w,h,now);drawArt(ctx,w,h,ps,F,now);drawFace(ctx,F,w,h);H.forEach((x,i)=>drawHand(ctx,x,i,w));drawPinchFeedback(ctx,ps,w,h);metric('fps',fps?fps.toFixed(0):'--');metric('infer',infer?`${infer.toFixed(1)} ms`:'--');metric('hands',hands.length?`${hands.length} · ${hands[0]?.length||0} pts`:'none');metric('face',faces.length?`${faces[0].length} pts`:'none');metric('gesture',gestureLabel(ps,hands));let active=ps.filter(p=>p.active);metric('pinch',active.length?`${active.length} ACTIVE · ${active.map(p=>p.side).join(' + ')}`:ps.length?`${ps.length} OPEN`:'--');syncModelBadges();if(state.debug){ctx.fillStyle='rgba(4,8,14,.76)';ctx.fillRect(12,12,Math.min(w*.68,560),82);ctx.fillStyle='#fff';ctx.font=`600 ${Math.max(10,w/85)}px ui-monospace`;ctx.textAlign='left';ctx.fillText(`${BUILD} · ${state.mode.toUpperCase()} · ${w}×${h}`,24,34);ctx.fillText(`HAND ${health.hand.backend} / FACE ${health.face.backend} / PINCH ${active.length}`,24,54);ctx.fillText(`JAW ${(blend('jawOpen')*100).toFixed(0)}% / HANDS ${hands.length} / FACE ${faces.length}`,24,74)}}'''
          sub(r"function draw\(now=performance.now\(\),force=false\)\{.*?\}\naddEventListener\('hashchange'",new_draw+"\naddEventListener('hashchange'")

          s=s.replace("globalThis.HJVision13={version:BUILD,get running(){return running},start,stop,state,health};","globalThis.HJVision14={version:BUILD,get running(){return running},start,stop,state,health,setMode};globalThis.HJVision13=globalThis.HJVision14;",1)
          p.write_text(s)
          p.rename('journal-v14-vision.js')

          css='''/* Vision Lab v14 — immersive interactive art surface. */
.v14-page{padding-top:108px}.v14-hero{display:grid;grid-template-columns:minmax(0,.78fr) minmax(0,1.22fr);gap:36px;align-items:end;margin:0 0 26px}.v14-hero>span{align-self:start;font:700 .64rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;color:var(--muted)}.v14-hero>div{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,.8fr);gap:28px;align-items:end}.v14-hero h1{margin:0;font-size:clamp(4.1rem,9.7vw,8.6rem);line-height:.79;letter-spacing:-.078em;font-weight:680}.v14-hero p{margin:0;color:var(--muted);font-size:clamp(.95rem,1.45vw,1.15rem);line-height:1.55;max-width:38ch;letter-spacing:-.02em}.v14-shell{display:grid;gap:8px}.v14-toolbar{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:21px;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}.v13-actions,.v14-view{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.v14-toolbar button,.v13-toggle span{min-height:38px;border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:rgba(127,127,127,.035);color:var(--text);font-size:.72rem;cursor:pointer;transition:transform .12s ease,background .18s ease,border-color .18s ease}.v14-toolbar button:active,.v13-toggle:active span{transform:scale(.96)}.v14-toolbar button:disabled{opacity:.3;cursor:default}.v14-toolbar .v13-primary{background:var(--text);color:var(--bg);border-color:transparent;font-weight:720}.v13-toggle{position:relative;cursor:pointer}.v13-toggle input{position:absolute;opacity:0;pointer-events:none}.v13-toggle span{display:flex;align-items:center}.v13-toggle input:checked+span{background:rgba(127,127,127,.12);border-color:rgba(170,180,200,.34)}.v13-toggle input:focus-visible+span,.v14-toolbar button:focus-visible,.v14-modebar button:focus-visible,.v14-full:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.v13-status{justify-self:end;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.68rem;white-space:nowrap}.v13-status i{width:7px;height:7px;border-radius:50%;background:#727680}.v14-page[data-state="loading"] .v13-status i{background:#ffb867}.v14-page[data-state="active"] .v13-status i{background:#5bd7a8;box-shadow:0 0 14px rgba(91,215,168,.55)}.v14-page[data-state="error"] .v13-status i{background:#ff7272}
.v14-stage-card{border:1px solid var(--line);border-radius:31px;padding:7px;background:rgba(127,127,127,.02);overflow:hidden}.v14-stage{position:relative;aspect-ratio:16/10;border-radius:24px;overflow:hidden;background:#05070b;isolation:isolate}.v14-stage video,.v14-stage canvas{position:absolute;inset:0;width:100%;height:100%}.v14-stage video{opacity:0;pointer-events:none;object-fit:cover}.v14-stage canvas{z-index:2;display:block}.v14-stage::after{content:"";position:absolute;z-index:5;inset:0;pointer-events:none;border:1px solid rgba(255,255,255,.08);border-radius:inherit;box-shadow:inset 0 0 90px rgba(0,0,0,.22)}.v14-modebar{position:absolute;z-index:8;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:3px;padding:4px;border:1px solid rgba(255,255,255,.13);border-radius:999px;background:rgba(7,9,14,.54);backdrop-filter:blur(18px) saturate(1.25);-webkit-backdrop-filter:blur(18px) saturate(1.25)}.v14-modebar button{border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.62);padding:8px 12px;font-size:.68rem;font-weight:650;cursor:pointer;transition:background .18s ease,color .18s ease,transform .12s ease}.v14-modebar button:active{transform:scale(.95)}.v14-modebar button.active{background:rgba(255,255,255,.14);color:#fff}.v14-full{position:absolute;z-index:8;right:12px;top:12px;width:38px;height:38px;border:1px solid rgba(255,255,255,.13);border-radius:50%;background:rgba(7,9,14,.54);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#fff;font-size:1rem;cursor:pointer}.v14-caption{position:absolute;z-index:8;left:16px;bottom:15px;display:grid;gap:3px;max-width:min(460px,70%);padding:11px 13px;border:1px solid rgba(255,255,255,.12);border-radius:16px;background:rgba(5,8,13,.48);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);color:#fff}.v14-caption b{font-size:.72rem;letter-spacing:-.01em}.v14-caption span{font-size:.68rem;line-height:1.38;color:rgba(255,255,255,.65)}.v14-stage:fullscreen{width:100vw;height:100vh;aspect-ratio:auto;border-radius:0}.v14-stage:fullscreen::after{border-radius:0}.v14-stage:fullscreen .v14-modebar{top:max(14px,env(safe-area-inset-top))}.v14-statusrail{display:flex;align-items:center;gap:7px;overflow:auto;padding:3px 2px 0;color:var(--muted);scrollbar-width:none}.v14-statusrail::-webkit-scrollbar{display:none}.v14-statusrail span{flex:0 0 auto;padding:7px 9px;border:1px solid var(--line);border-radius:999px;font:650 .57rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.05em}.v14-diagnostics{margin-top:4px;border-top:1px solid var(--line);padding-top:10px}.v14-diagnostics summary{cursor:pointer;color:var(--muted);font-size:.68rem;list-style:none}.v14-diagnostics summary::-webkit-details-marker{display:none}.v13-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;margin-top:9px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--line)}.v13-metrics article{min-width:0;padding:10px;background:var(--bg);display:grid;gap:7px}.v13-metrics span{font:650 .56rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.07em;color:var(--muted)}.v13-metrics strong{font-size:.76rem;overflow-wrap:anywhere}
@media(max-width:900px){.v14-hero{grid-template-columns:1fr;gap:18px}.v14-hero>div{grid-template-columns:1fr;gap:16px}.v14-hero h1{font-size:clamp(4.5rem,17vw,7.8rem)}.v14-toolbar{grid-template-columns:1fr auto}.v14-view{grid-column:1/-1}.v13-status{justify-self:end}.v14-stage{aspect-ratio:4/5}}
@media(max-width:620px){.v14-page{padding-top:96px}.v14-hero{margin-bottom:18px}.v14-hero h1{font-size:clamp(4rem,20vw,6.6rem)}.v14-hero p{font-size:.92rem}.v14-toolbar{padding:8px;border-radius:18px}.v13-actions{display:grid;grid-template-columns:1fr 1fr;width:100%}.v13-actions .v13-primary{grid-column:1/-1}.v14-view{display:grid;grid-template-columns:repeat(3,1fr);width:100%}.v14-toolbar button,.v13-toggle span{min-height:44px;justify-content:center}.v14-stage-card{padding:5px;border-radius:22px}.v14-stage{aspect-ratio:3/4;border-radius:18px}.v14-modebar{top:9px;max-width:calc(100% - 66px);overflow:auto;left:10px;transform:none;scrollbar-width:none}.v14-modebar::-webkit-scrollbar{display:none}.v14-modebar button{padding:8px 11px}.v14-full{top:9px;right:9px}.v14-caption{left:10px;bottom:10px;max-width:calc(100% - 20px)}.v13-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){.v14-toolbar button,.v13-toggle span,.v14-modebar button{transition:none!important}.v14-stage canvas{scroll-behavior:auto}}
'''
          Path('journal-v14-vision.css').write_text(css)
          Path('journal-v13-vision.css').unlink()

          manifest=Path('runtime-manifest.json')
          m=manifest.read_text().replace('journal-v13-vision.css','journal-v14-vision.css').replace('journal-v13-vision.js','journal-v14-vision.js')
          manifest.write_text(m)

          old_rev='SITE35-VISION13_7-20260912-1247'
          new_rev='SITE36-VISION14-20260912-1252'
          for name in ['journal-route-loader.js','index.html']:
              q=Path(name);t=q.read_text()
              if old_rev not in t: raise SystemExit(f'missing old revision in {name}')
              q.write_text(t.replace(old_rev,new_rev))

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          node --check journal-v14-vision.js
          node --check journal-route-loader.js
          python - <<'PY'
          from pathlib import Path
          import json
          s=Path('journal-v14-vision.js').read_text()
          assert "BUILD='VISION14-20260912-1252'" in s
          assert 'function pinches(' in s and 'return out.sort' in s
          assert 'grabs=new Map()' in s and 'lastPinches=new Map()' in s
          assert "state.mode==='orbit'" in s and "state.mode==='threads'" in s and "state.mode==='bloom'" in s
          assert 'drawSculpt' in s and 'drawThreads' in s and 'drawBloom' in s
          assert 'data-v14-mode="orbit"' in s and 'data-v14-mode="sculpt"' in s
          assert 'requestFullscreen' in s
          assert 'globalThis.HJVision14' in s
          assert not Path('journal-v13-vision.js').exists()
          assert not Path('journal-v13-vision.css').exists()
          assert Path('journal-v14-vision.css').exists()
          m=json.loads(Path('runtime-manifest.json').read_text())
          v=next(x for x in m['routes'] if x['id']=='vision')
          assert v['styles']==['journal-v14-vision.css'] and v['scripts']==['journal-v14-vision.js']
          rev='SITE36-VISION14-20260912-1252'
          assert rev in Path('journal-route-loader.js').read_text()
          assert Path('index.html').read_text().count(rev)==2
          print('Vision v14 interactive art contract: ok')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: turn Vision Lab into a dual-hand interactive art playground"
          git push origin HEAD:feat/vision-v14-interactive-art
