<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vision Physical Camera Probe P4</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#050607;color:#f5f7fa;font-family:system-ui,-apple-system,sans-serif}body{min-height:100dvh;padding:14px}.wrap{max-width:620px;margin:auto}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.sub{font-size:12px;color:#8f99a3;margin-top:4px;line-height:1.35}.tag{font:700 12px/1 ui-monospace,monospace;color:#69ffb0;border:1px solid #2a8f60;padding:8px 10px;border-radius:999px;white-space:nowrap}.stage{position:relative;width:100%;aspect-ratio:9/16;background:#111;border-radius:26px;overflow:hidden;border:1px solid #30343a;box-shadow:0 18px 60px rgba(0,0,0,.32)}canvas{width:100%;height:100%;display:block;background:#111}.buttons{display:grid;grid-template-columns:1.2fr 1fr;gap:8px;margin-top:12px}button{height:52px;border:0;border-radius:16px;font-weight:800;font-size:15px;background:#e9fff4;color:#07130d}button.secondary{background:#171b20;color:#eef3f7;border:1px solid #303740}button:disabled{opacity:.45}.hud{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.box{background:#111418;border:1px solid #292f36;border-radius:14px;padding:10px;min-height:62px}.k{font:600 10px/1.2 ui-monospace,monospace;color:#9ba5af}.v{font:700 14px/1.35 ui-monospace,monospace;margin-top:6px;word-break:break-word}.wide{grid-column:1/-1}.err{color:#ff7777}.ok{color:#69ffb0}.warn{color:#ffd86b}video{position:fixed;left:-9999px;top:0;width:2px;height:2px;opacity:.01;pointer-events:none}
</style>
</head>
<body><div class="wrap">
<div class="head"><div><b>Physical Camera Probe</b><div class="sub">실제 getUserMedia · CPU IMAGE · same-frame Face + Hands · 9:16 cover</div></div><div class="tag">PROBE P4</div></div>
<div class="stage"><canvas id="out"></canvas></div>
<div class="buttons"><button id="start" disabled>모델 준비 중…</button><button id="copy" class="secondary">숫자 진단 복사</button></div>
<div class="hud">
<div class="box"><div class="k">STATE</div><div class="v" id="state">boot</div></div>
<div class="box"><div class="k">CAMERA / INFER</div><div class="v" id="cam">--</div></div>
<div class="box"><div class="k">FACE</div><div class="v" id="face">--</div></div>
<div class="box"><div class="k">HANDS</div><div class="v" id="hands">--</div></div>
<div class="box"><div class="k">RUNS / INVALID</div><div class="v" id="runs">0 / 0</div></div>
<div class="box"><div class="k">FRAME TIME</div><div class="v" id="timing">--</div></div>
<div class="box wide"><div class="k">FACE #1 / BOX</div><div class="v" id="coord">--</div></div>
<div class="box wide"><div class="k">ERROR / RECOVERY</div><div class="v" id="error">none</div></div>
</div>
<video id="video" autoplay playsinline muted></video>
<canvas id="source" hidden></canvas>
<canvas id="infer" hidden></canvas>
</div>
<script type="module">
const VERSION='1.0.1', REV='P4-20260830-2212';
const MOD=`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VERSION}/vision_bundle.mjs`;
const WASM=`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VERSION}/wasm`;
const FACE_MODEL='https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
const HAND_MODEL='https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
const $=id=>document.getElementById(id),video=$('video'),canvas=$('out'),ctx=canvas.getContext('2d',{alpha:false}),source=$('source'),sctx=source.getContext('2d',{alpha:false}),infer=$('infer'),ictx=infer.getContext('2d',{alpha:false}),start=$('start'),copy=$('copy');
let vision,fileset,faceTask,handTask,stream,running=false,lastDetect=0,detectRuns=0,invalid=0,recoveries=0,rebuilding=false,lastError='none',lastFace=null,lastHands=[];
const HAND_CONNECTIONS=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
const set=(id,v,cls='')=>{const n=$(id);n.textContent=v;n.className='v '+cls};
const finite=v=>Number.isFinite(v);
function recordError(e){lastError=`${e?.name||'Error'}: ${e?.message||e}`;set('error',`${lastError}\nrecovery=${recoveries}`,'err');console.error(e)}
function size(){const r=canvas.getBoundingClientRect(),d=Math.min(1.75,devicePixelRatio||1),w=Math.max(2,Math.round(r.width*d)),h=Math.max(2,Math.round(r.height*d));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}return{w,h}}
function ensureBuffers(){const vw=video.videoWidth,vh=video.videoHeight;if(!vw||!vh)return false;if(source.width!==vw||source.height!==vh){source.width=vw;source.height=vh;const k=Math.min(1,640/Math.max(vw,vh));infer.width=Math.max(2,Math.round(vw*k));infer.height=Math.max(2,Math.round(vh*k));set('cam',`${vw}×${vh} → ${infer.width}×${infer.height}`)}return true}
function cover(vw,vh,w,h){const z=Math.max(w/vw,h/vh),rw=vw*z,rh=vh*z;return{rw,rh,dx:(w-rw)/2,dy:(h-rh)/2}}
function project(p,t,w){const sx=t.dx+p.x*t.rw;return{x:w-sx,y:t.dy+p.y*t.rh}}
function path(links,P,color,width){ctx.beginPath();let count=0;for(const e of links||[]){const a=P[e.start??e[0]],b=P[e.end??e[1]];if(!a||!b||!finite(a.x)||!finite(a.y)||!finite(b.x)||!finite(b.y))continue;ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);count++}if(count){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}return count}
function drawFrame(){const {w,h}=size();ctx.fillStyle='#080a0d';ctx.fillRect(0,0,w,h);if(!source.width||!source.height)return{w,h,t:null};const t=cover(source.width,source.height,w,h);ctx.save();ctx.translate(w,0);ctx.scale(-1,1);ctx.drawImage(source,t.dx,t.dy,t.rw,t.rh);ctx.restore();return{w,h,t}}
function drawFace(lm,t,w,h){if(!lm?.length||!t){set('face','0');set('coord','no face');return}const valid=lm.length>400&&lm.every(p=>finite(p.x)&&finite(p.y)&&finite(p.z));if(!valid){invalid++;set('face','INVALID','err');return}const P=lm.map(p=>project(p,t,w)),F=vision.FaceLandmarker;
ctx.save();ctx.shadowColor='#00ff77';ctx.shadowBlur=Math.max(7,w/90);const edges=path(F.FACE_LANDMARKS_TESSELATION,P,'#00ff77',Math.max(2.7,w/150));ctx.shadowBlur=0;path(F.FACE_LANDMARKS_FACE_OVAL,P,'#ffffff',Math.max(4,w/115));path(F.FACE_LANDMARKS_LEFT_EYE,P,'#25d9ff',Math.max(4,w/120));path(F.FACE_LANDMARKS_RIGHT_EYE,P,'#25d9ff',Math.max(4,w/120));path(F.FACE_LANDMARKS_LIPS,P,'#ff4db8',Math.max(4,w/120));ctx.restore();
let minX=1e9,minY=1e9,maxX=-1,maxY=-1;for(const p of P){minX=Math.min(minX,p.x);minY=Math.min(minY,p.y);maxX=Math.max(maxX,p.x);maxY=Math.max(maxY,p.y)}const p=P[1];set('face',`${lm.length} pts / ${edges} edges`,'ok');set('coord',`#1 ${p.x.toFixed(1)},${p.y.toFixed(1)} | box ${minX.toFixed(0)},${minY.toFixed(0)} → ${maxX.toFixed(0)},${maxY.toFixed(0)}`)}
function drawHands(hands,t,w){if(!t||!hands?.length){set('hands','0');return}let good=0;for(let hi=0;hi<hands.length;hi++){const lm=hands[hi];if(lm?.length!==21||!lm.every(p=>finite(p.x)&&finite(p.y)&&finite(p.z))){invalid++;continue}good++;const P=lm.map(p=>project(p,t,w));ctx.save();ctx.shadowColor='#ffd84d';ctx.shadowBlur=Math.max(6,w/110);path(HAND_CONNECTIONS,P,'#ffd84d',Math.max(5,w/110));ctx.shadowBlur=0;for(let i=0;i<P.length;i++){const p=P[i];ctx.beginPath();ctx.arc(p.x,p.y,i===0?Math.max(8,w/70):Math.max(6,w/90),0,Math.PI*2);ctx.fillStyle=i===0?'#ffffff':'#ff9d2e';ctx.fill();ctx.strokeStyle='#111';ctx.lineWidth=Math.max(2,w/260);ctx.stroke()}ctx.restore()}set('hands',`${good} hand${good===1?'':'s'} / ${good*21} pts`,good?'ok':'')}
function render(faceLm,hands){const {w,h,t}=drawFrame();drawFace(faceLm,t,w,h);drawHands(hands,t,w);ctx.font=`800 ${Math.max(15,w/35)}px ui-monospace,monospace`;ctx.fillStyle='rgba(0,0,0,.78)';ctx.fillRect(12,12,Math.min(w-24,w*.94),Math.max(42,w/13));ctx.fillStyle='#8cffc7';ctx.fillText(`P4 · FACE ${faceLm?.length||0} · HAND ${hands?.length||0}`,24,12+Math.max(28,w/18))}
async function makeTasks(){if(rebuilding)return;rebuilding=true;try{try{faceTask?.close?.()}catch{}try{handTask?.close?.()}catch{}faceTask=await vision.FaceLandmarker.createFromOptions(fileset,{baseOptions:{modelAssetPath:FACE_MODEL},runningMode:'IMAGE',numFaces:1,minFaceDetectionConfidence:.5,minFacePresenceConfidence:.5,minTrackingConfidence:.5});handTask=await vision.HandLandmarker.createFromOptions(fileset,{baseOptions:{modelAssetPath:HAND_MODEL},runningMode:'IMAGE',numHands:2,minHandDetectionConfidence:.45,minHandPresenceConfidence:.45,minTrackingConfidence:.45});recoveries++;set('error',`none · recovery=${recoveries}`,'ok')}finally{rebuilding=false}}
async function recover(e){recordError(e);if(rebuilding)return;set('state','RECOVERING MODELS','warn');try{await makeTasks();set('state','LIVE · FACE + HAND','ok')}catch(x){recordError(x);set('state','RECOVERY FAILED','err')}}
function loop(now){if(!running)return;if(faceTask&&handTask&&!rebuilding&&video.readyState>=2&&now-lastDetect>=120&&ensureBuffers()){lastDetect=now;const begun=performance.now();try{sctx.drawImage(video,0,0,source.width,source.height);ictx.drawImage(source,0,0,infer.width,infer.height);const fr=faceTask.detect(infer),hr=handTask.detect(infer);detectRuns++;lastFace=fr?.faceLandmarks?.[0]||null;lastHands=hr?.landmarks||[];render(lastFace,lastHands);set('runs',`${detectRuns} / ${invalid}`,invalid?'warn':'');set('timing',`${(performance.now()-begun).toFixed(0)} ms`)}catch(e){invalid++;set('runs',`${detectRuns} / ${invalid}`,'warn');recover(e)}}requestAnimationFrame(loop)}
async function init(){try{set('state','loading face + hand');vision=await import(MOD);fileset=await vision.FilesetResolver.forVisionTasks(WASM);await makeTasks();recoveries=0;set('error','none','ok');set('state','models ready · CPU IMAGE','ok');start.disabled=false;start.textContent='실제 전면카메라 시작'}catch(e){recordError(e);set('state','MODEL ERROR','err')}}
start.addEventListener('click',async()=>{try{start.disabled=true;set('state','requesting camera');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'user'},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30,max:30}}});video.srcObject=stream;await video.play();ensureBuffers();set('state','LIVE · FACE + HAND','ok');running=true;requestAnimationFrame(loop);start.textContent='실행 중'}catch(e){start.disabled=false;recordError(e);set('state','CAMERA ERROR','err')}});
copy.addEventListener('click',async()=>{const text=[`Vision Probe ${REV}`,`state=${$('state').textContent}`,`camera=${$('cam').textContent}`,`face=${$('face').textContent}`,`hands=${$('hands').textContent}`,`runs_invalid=${$('runs').textContent}`,`frame_time=${$('timing').textContent}`,`coord=${$('coord').textContent}`,`error=${$('error').textContent}`].join('\n');try{await navigator.clipboard.writeText(text);copy.textContent='복사됨';setTimeout(()=>copy.textContent='숫자 진단 복사',1200)}catch{copy.textContent='복사 실패'}});
addEventListener('beforeunload',()=>stream?.getTracks().forEach(t=>t.stop()));init();
</script></body></html>
