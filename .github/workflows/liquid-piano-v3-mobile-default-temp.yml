name: Temporary Liquid Piano mobile default
on:
  push:
    branches:
      - perf/liquid-piano-v3-mobile-default
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/liquid-piano-v3-mobile-default
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set mobile-first performance default and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('journal-v15-liquid-piano.js')
          s=p.read_text()
          old="mode:'standard',quality:'balanced',keyWidth:54"
          new="mode:'standard',quality:(globalThis.matchMedia?.('(pointer:coarse)')?.matches?'performance':'balanced'),keyWidth:54"
          assert old in s
          s=s.replace(old,new,1).replace("PIANO3-PRO-20260915-1408","PIANO3_1-MOBILEPERF-20260915-1428",1)
          p.write_text(s)
          for name in ['journal-route-loader.js','index.html']:
              q=Path(name); t=q.read_text(); assert 'SITE48-LIQUIDPIANO3-PRO-20260915-1408' in t
              q.write_text(t.replace('SITE48-LIQUIDPIANO3-PRO-20260915-1408','SITE49-LIQUIDPIANO3_1-MOBILEPERF-20260915-1428'))
          PY
          node --check journal-v15-liquid-piano.js
          grep -F "quality:(globalThis.matchMedia?.('(pointer:coarse)')?.matches?'performance':'balanced')" journal-v15-liquid-piano.js
          grep -F 'SITE49-LIQUIDPIANO3_1-MOBILEPERF-20260915-1428' journal-route-loader.js index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add journal-v15-liquid-piano.js journal-route-loader.js index.html
          git commit -m 'perf: default touch devices to piano performance mode [skip ci]'
          git push origin HEAD:perf/liquid-piano-v3-mobile-default
