function startScan(){frames={center:[],left:[],right:[],up:[],down:[]};idx=0;hold=0;side=vert=0;basePitch=null;result=shareBlob=null;active=true;scan.disabled=true;share.disabled=true;$('score').textContent='--';$('grade').textContent='측정 중';$('status').textContent='1/5 · 정면';$('meta').textContent='자세가 맞으면 자동 진행';renderUI()}
function draw(){const [w,h]=size();ctx.fillStyle='#111';ctx.fillRect(0,0,w,h);let t=null;if(src.width){t=cover(src.width,src.height,w,h);ctx.save();ctx.translate(w,0);ctx.scale(-1,1);ctx.drawImage(src,t[2],t[3],t[0],t[1]);ctx.restore()}if(P&&vision){ctx.save();ctx.globalAlpha=.65;ctx.beginPath();for(const e of vision.FaceLandmarker.FACE_LANDMARKS_TESSELATION){const a=P[e.start],b=P[e.end];ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y)}ctx.strokeStyle='#73c9ff';ctx.lineWidth=Math.max(1,w/620);ctx.stroke();ctx.restore()}return[w,h,t]}
async function loop(t){requestAnimationFrame(loop);if(run&&video.readyState>=2&&buffers()&&t-lastPreview>33){lastPreview=t;sx.drawImage(video,0,0,src.width,src.height)}const [w,h,tr]=draw();if(!run||!tr){renderUI();return}if(!task){renderUI();return}if(t-last>100){last=t;ix.drawImage(src,0,0,inf.width,inf.height);const r=task.detect(inf),raw=r.faceLandmarks?.[0]||null,B=blend(r.faceBlendshapes?.[0]?.categories);L=smooth(L,raw,.38);R=smooth(R,raw,.78);if(L&&R){M=evalFace(L,B);P=R.map(p=>project(p,tr,w));inside=placed(P,w,h);if(M&&active){poseOK=inside&&match(M);const dt=t0?Math.min(160,t-t0):0;t0=t;if(poseOK){hold+=dt;frames[steps[idx][0]].push({m:{...M},lm:L.map(p=>({...p}))});if(hold>=steps[idx][4])stepDone()}else hold=Math.max(0,hold-dt*.4)}$('dbg').textContent=M?`yaw ${M.yaw.toFixed(3)} · pitch ${M.pitch.toFixed(3)} · score ${M.total.toFixed(1)}`:'얼굴 없음'}}renderUI()}
async function prepShare(){try{const C=document.createElement('canvas');C.width=1080;C.height=1350;const q=C.getContext('2d');q.fillStyle='#f5f5f2';q.fillRect(0,0,1080,1350);q.fillStyle='#171717';q.font='800 58px system-ui';q.fillText('Face Rate',70,95);q.font='900 126px system-ui';q.fillText(result.total.toFixed(1),70,260);q.fillStyle='#2563eb';q.font='800 44px system-ui';q.fillText($('grade').textContent,70,315);q.fillStyle='#fff';q.strokeStyle='#ddd';q.beginPath();q.roundRect(135,365,810,550,24);q.fill();q.stroke();const Q=result.mesh;let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;for(const p of Q){x1=Math.min(x1,p.x);y1=Math.min(y1,p.y);x2=Math.max(x2,p.x);y2=Math.max(y2,p.y)}const sc=Math.min(700/(x2-x1),470/(y2-y1)),ox=190+(700-(x2-x1)*sc)/2-x1*sc,oy=405+(470-(y2-y1)*sc)/2-y1*sc;q.beginPath();for(const e of vision.FaceLandmarker.FACE_LANDMARKS_TESSELATION){const a=Q[e.start],b=Q[e.end];q.moveTo(ox+a.x*sc,oy+a.y*sc);q.lineTo(ox+b.x*sc,oy+b.y*sc)}q.strokeStyle='#4b8df3';q.lineWidth=1.7;q.stroke();shareBlob=await new Promise(r=>C.toBlob(r,'image/png'));share.disabled=false}catch{share.disabled=false}}
async function doShare(){if(!result)return;const text=`Face Rate ${result.total.toFixed(1)}/100`;if(shareBlob){const f=new File([shareBlob],'face-rate.png',{type:'image/png'});if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[f]})))return navigator.share({title:'Face Rate',text,files:[f]}).catch(()=>{})}navigator.share?navigator.share({title:'Face Rate',text,url:location.href}).catch(()=>{}):navigator.clipboard?.writeText(text)}
cam.onclick=async()=>{cam.disabled=true;try{if(!run){cam.textContent='카메라 여는 중…';stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'user'},width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30,max:30}}});video.srcObject=stream;await video.play();run=true;buffers()}if(!task){cam.textContent='모델 불러오는 중…';await loadModel()}cam.textContent='카메라 켜짐';scan.disabled=false;renderUI()}catch(e){cam.disabled=false;cam.textContent=run?'모델 재시도':'카메라 오류';$('dbg').textContent=`오류 · ${e?.message||e}`;renderUI()}};scan.onclick=startScan;share.onclick=doShare;cam.disabled=false;loadModel().catch(()=>{});renderUI();requestAnimationFrame(loop);
</script></body></html>
