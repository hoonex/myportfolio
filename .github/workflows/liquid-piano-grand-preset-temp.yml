name: Temporary Liquid Piano Grand preset verify
on:
  push:
    branches:
      - fix/liquid-piano-real-samples-bass
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/liquid-piano-real-samples-bass
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Grand preset patch
        run: python .github/patch-liquid-piano-grand-preset.py
      - name: Verify
        run: |
          node --check journal-v15-liquid-piano.js
          grep -q "grand:{label:'Grand'" journal-v15-liquid-piano.js
          grep -q "preset='grand'" journal-v15-liquid-piano.js
          grep -q "sample=preset==='grand'" journal-v15-liquid-piano.js
          grep -q "if(preset==='grand')decodeSample(anchor)" journal-v15-liquid-piano.js
      - name: Commit product patch
        run: |
          git config user.name "hoonex"
          git config user.email "163626004+hoonex@users.noreply.github.com"
          git add journal-v15-liquid-piano.js
          git commit -m "fix: make real piano samples the Grand preset"
          git push origin HEAD:fix/liquid-piano-real-samples-bass
