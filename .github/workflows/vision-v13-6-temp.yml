name: Temporary Vision v13.6 hand initialization repair

on:
  push:
    branches:
      - fix/vision-v13-6-hand-init-race

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vision-v13-6-hand-init-race
          fetch-depth: 0

      - name: Repair MediaPipe hand initialization and fallback
        shell: python
        run: |
          from pathlib import Path
          p=Path('journal-v13-vision.js')
          s=p.read_text()

          def rep(old,new):
              global s
              if old not in s:
                  raise SystemExit('missing expected source: '+old[:260])
              s=s.replace(old,new,1)

          rep('/* Vision Lab v13.5 — proven gesture hand tracker + yaw-aware opaque face shell. */','/* Vision Lab v13.6 — serialized MediaPipe init + self-healing gesture hand tracker. */')
          rep("const R='/lab/vision',MPV='1.0.1',BUILD='VISION13.5-20260911-2336';","const R='/lab/vision',MPV='1.0.1',BUILD='VISION13.6-20260911-2348';")

          rep("let root=null,stream=null,facing='user',running=false,vfc=0,raf=0,mp=null,fileset=null,modelsP=null,handTask=null,faceTask=null,hand=null,face=null,lastH=-1e9,lastF=-1e9,lastVideoTime=-1,infer=0,fps=0,frames=0,fpsAt=performance.now(),lastDraw=0,lastBurst=0,ro=null;",
              "let root=null,stream=null,facing='user',running=false,vfc=0,raf=0,mp=null,fileset=null,filesetP=null,modelsP=null,handTask=null,faceTask=null,hand=null,face=null,lastH=-1e9,lastF=-1e9,lastVideoTime=-1,infer=0,fps=0,frames=0,fpsAt=performance.now(),lastDraw=0,lastBurst=0,handEmptyRuns=0,ro=null;")

          old="async function resolveFileset(){if(fileset)return fileset;let mod=await importRuntime(),last;for(let url of WASMS){try{fileset=await mod.FilesetResolver.forVisionTasks(url);return fileset}catch(e){last=e;console.warn('[Vision13.1] wasm source failed',url,e)}}throw last||Error('MediaPipe WASM unavailable')}"
          new="async function resolveFileset(){if(fileset)return fileset;if(filesetP)return filesetP;filesetP=(async()=>{let mod=await importRuntime(),last;for(let url of WASMS){try{return fileset=await mod.FilesetResolver.forVisionTasks(url)}catch(e){last=e;console.warn('[Vision13.6] wasm source failed',url,e)}}throw last||Error('MediaPipe WASM unavailable')})().finally(()=>filesetP=null);return filesetP}"
          rep(old,new)

          old="async function ensureModels(){if(handTask&&faceTask)return;if(modelsP)return modelsP;modelsP=(async()=>{status(T().load,'loading');let results=await Promise.allSettled([handTask?Promise.resolve(handTask):createTask('hand'),faceTask?Promise.resolve(faceTask):createTask('face')]);if(results[0].status==='fulfilled')handTask=results[0].value;else{health.hand.error=String(results[0].reason?.message||results[0].reason||'init failed');console.error('[Vision13.1] hand model init failed',results[0].reason)}if(results[1].status==='fulfilled')faceTask=results[1].value;else{health.face.error=String(results[1].reason?.message||results[1].reason||'init failed');console.error('[Vision13.1] face model init failed',results[1].reason)}syncModelBadges();if(!handTask&&!faceTask)throw Error('Both Vision models failed to initialize')})().finally(()=>modelsP=null);return modelsP}"
          new="async function ensureModels(){if(handTask&&faceTask)return;if(modelsP)return modelsP;modelsP=(async()=>{status(T().load,'loading');if(!handTask){try{handTask=await createTask('hand');health.hand.error=''}catch(e){health.hand.error=String(e?.message||e||'init failed');console.error('[Vision13.6] hand model init failed',e)}}if(!faceTask){try{faceTask=await createTask('face');health.face.error=''}catch(e){health.face.error=String(e?.message||e||'init failed');console.error('[Vision13.6] face model init failed',e)}}syncModelBadges();if(!handTask&&!faceTask)throw Error('Both Vision models failed to initialize')})().finally(()=>modelsP=null);return modelsP}"
          rep(old,new)

          rep("running=true;hand=face=null;lastH=lastF=-1e9;lastVideoTime=-1;frames=fps=infer=0;",
              "running=true;hand=face=null;handEmptyRuns=0;lastH=lastF=-1e9;lastVideoTime=-1;frames=fps=infer=0;")

          rep("hand=face=null;grab=null;lastPinch=null;pinchState.clear();lastVideoTime=-1;",
              "hand=face=null;handEmptyRuns=0;grab=null;lastPinch=null;pinchState.clear();lastVideoTime=-1;")

          old="let begin=performance.now(),runs=0,ts=Math.max(0,Math.round(now));if(handTask&&now-lastH>=110&&!health.hand.recovering){try{hand=handTask.recognizeForVideo(v,ts);lastH=now;runs++;recordSuccess('hand')}catch(e){recordFailure('hand',e)}}if(faceTask&&now-lastF>=66&&!health.face.recovering){try{face=faceTask.detectForVideo(v,ts);lastF=now;runs++;recordSuccess('face')}catch(e){recordFailure('face',e)}}"
          new="let begin=performance.now(),runs=0,ts=Math.max(0,performance.now());if(handTask&&now-lastH>=110&&!health.hand.recovering){try{hand=handTask.recognizeForVideo(v,ts);lastH=now;runs++;recordSuccess('hand');if(hand?.landmarks?.length)handEmptyRuns=0;else if(++handEmptyRuns>=18&&!health.hand.cpu){handEmptyRuns=0;console.warn('[Vision13.6] hand tracker returned sustained empty results; switching hand task to CPU');recover('hand')}}catch(e){recordFailure('hand',e)}}if(faceTask&&now-lastF>=66&&!health.face.recovering){try{face=faceTask.detectForVideo(v,ts);lastF=now;runs++;recordSuccess('face')}catch(e){recordFailure('face',e)}}"
          rep(old,new)

          rep("console.warn('[Vision13.1] runtime source failed',url,e)","console.warn('[Vision13.6] runtime source failed',url,e)")
          rep("console.warn(`[Vision13.1] ${kind} GPU init failed; CPU fallback`,e)","console.warn(`[Vision13.6] ${kind} GPU init failed; CPU fallback`,e)")
          rep("console.error(`[Vision13.1] ${kind} CPU recovery failed`,e)","console.error(`[Vision13.6] ${kind} CPU recovery failed`,e)")
          rep("console.warn(`[Vision13.1] ${kind} frame failed #${h.fails}`,e)","console.warn(`[Vision13.6] ${kind} frame failed #${h.fails}`,e)")
          rep("console.error('[Vision13.1] start',e)","console.error('[Vision13.6] start',e)")

          p.write_text(s)

          old_rev='SITE33-VISION13_5-20260911-2336'
          new_rev='SITE34-VISION13_6-20260911-2348'
          for name in ['journal-route-loader.js','index.html']:
              q=Path(name);t=q.read_text()
              if old_rev not in t: raise SystemExit(f'missing old revision in {name}')
              q.write_text(t.replace(old_rev,new_rev))

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          node --check journal-v13-vision.js
          node --check journal-route-loader.js
          python - <<'PY'
          from pathlib import Path
          s=Path('journal-v13-vision.js').read_text()
          assert "BUILD='VISION13.6-20260911-2348'" in s
          assert 'filesetP=null' in s
          assert 'if(filesetP)return filesetP' in s
          assert 'Promise.allSettled' not in s
          assert "handTask=await createTask('hand')" in s
          assert "faceTask=await createTask('face')" in s
          assert s.index("handTask=await createTask('hand')") < s.index("faceTask=await createTask('face')")
          assert 'ts=Math.max(0,performance.now())' in s
          assert 'handEmptyRuns>=18' in s
          assert "recover('hand')" in s
          assert 'recognizeForVideo(v,ts)' in s
          rev='SITE34-VISION13_6-20260911-2348'
          assert rev in Path('journal-route-loader.js').read_text()
          assert Path('index.html').read_text().count(rev)==2
          print('Vision v13.6 hand initialization repair contract: ok')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add journal-v13-vision.js journal-route-loader.js index.html
          git commit -m "fix: serialize Vision model init and recover empty hand tracking"
          git push origin HEAD:fix/vision-v13-6-hand-init-race
