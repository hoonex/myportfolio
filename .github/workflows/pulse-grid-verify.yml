name: Verify Pulse Grid MVP

on:
  push:
    branches: [feat/pulse-grid-mvp]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax checks
        run: |
          node --check journal-v29-rhythm-chart.js
          node --check journal-v29-rhythm-audio.js
          node --check journal-v29-rhythm-game.js
          node --check journal-route-loader.js
          node --check portfolio-roadmap.js
          node -e "JSON.parse(require('fs').readFileSync('runtime-manifest.json','utf8')); JSON.parse(require('fs').readFileSync('portfolio-roadmap.json','utf8'))"
      - name: Chart and judgement invariants
        run: |
          node <<'NODE'
          require('./journal-v29-rhythm-chart.js');
          const core=globalThis.HJRhythmChartV29;
          const chart=core.generateChart();
          if(chart.notes.length!==148) throw new Error(`expected 148 notes, got ${chart.notes.length}`);
          if(chart.bpm!==132) throw new Error('BPM drift');
          if(chart.notes.some((n,i,a)=>n.lane<0||n.lane>3||(i&&n.time<a[i-1].time))) throw new Error('invalid chart ordering/lane');
          for(const [d,q] of [[.044,'perfect'],[.07,'great'],[.12,'good'],[.2,'miss']]) if(core.classify(d)!==q) throw new Error(`judgement ${d}`);
          console.log({notes:chart.notes.length,duration:chart.duration,bpm:chart.bpm});
          NODE
      - name: Route and portfolio contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const manifest=JSON.parse(fs.readFileSync('runtime-manifest.json','utf8'));
          const route=manifest.routes.find(x=>x.id==='pulse-grid');
          if(!route||!route.paths.includes('/lab/rhythm')) throw new Error('Pulse Grid route missing');
          const expected=['journal-v29-rhythm-chart.js','journal-v29-rhythm-audio.js','journal-v29-rhythm-game.js'];
          if(JSON.stringify(route.scripts)!==JSON.stringify(expected)) throw new Error('runtime script order drift');
          if(!route.styles.includes('journal-v29-rhythm.css')) throw new Error('rhythm CSS missing');
          const roadmap=JSON.parse(fs.readFileSync('portfolio-roadmap.json','utf8'));
          const project=roadmap.projects['rhythm-game'];
          if(project?.status!=='playable'||project.href!=='#/lab/rhythm'||project.title!=='Pulse Grid') throw new Error('roadmap not promoted');
          const game=fs.readFileSync('journal-v29-rhythm-game.js','utf8');
          for(const needle of ['AudioContext.currentTime','KeyD:0','KeyF:1','KeyJ:2','KeyK:3','pointerdown','audio.songTime()']) if(!game.includes(needle)) throw new Error(`missing ${needle}`);
          const loader=fs.readFileSync('journal-route-loader.js','utf8');
          if(!loader.includes('SITE56-PULSEGRID-MVP-20260916')) throw new Error('cache revision not bumped');
          const index=fs.readFileSync('index.html','utf8');
          for(const needle of ['portfolio-roadmap.css?v=SITE56-PULSEGRID-MVP-20260916','portfolio-roadmap.js?v=SITE56-PULSEGRID-MVP-20260916','journal-route-loader.js?v=SITE56-PULSEGRID-MVP-20260916']) if(!index.includes(needle)) throw new Error(`stale index asset ${needle}`);
          NODE
      - name: Patch hygiene
        run: git diff --check 7ea5c94abb3d25d4978be524919cbd156eb90cc8..HEAD
