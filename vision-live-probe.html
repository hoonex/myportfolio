<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Face Rate</title></head><body><script>
(async()=>{
  const BASE='https://raw.githubusercontent.com/hoonex/myportfolio/e7bdf82af9d1aa6e4653bc7d553b5948208739f1/vision-live-probe.html';
  let h=await (await fetch(BASE,{cache:'no-store'})).text();
  h=h.replace('P13</div>','P14.1</div>')
     .replace('얼굴을 움직이며 여러 각도를 부드럽게 스캔합니다.','안내에 따라 얼굴을 천천히 움직여주세요.')
     .replace('얼굴을 움직이면 흰 점이 따라갑니다.','화면 안내에 따라 얼굴을 천천히 움직여주세요.')
     .replace("const x=cl(q.yaw/.115,-1.15,1.15)","const x=cl(-q.yaw/.115,-1.15,1.15)")
     .replaceAll('흰 점을 파란 점에 맞추세요','안내 방향으로 천천히 움직이세요');
  h=h.replace(/const steps=\[.*?\],names=\['정면','측면','반대','위','아래'\];/s,`const steps=[
 {key:'center',label:'정면',title:'정면을 바라봐 주세요',hint:'얼굴을 중앙에 맞추면 자동으로 시작합니다',hold:900,min:8,tx:0,ty:0,tol:.30},
 {key:'left',label:'오른쪽',title:'화면 오른쪽을 봐 주세요',hint:'고개만 천천히 돌리세요 · 옆면이 조금 더 보일 정도까지 천천히 돌리세요',hold:820,min:7,tx:.80,ty:0,tol:.24},
 {key:'right',label:'왼쪽',title:'화면 왼쪽을 봐 주세요',hint:'반대쪽도 옆면이 충분히 보일 정도까지 돌려주세요',hold:820,min:7,tx:-.80,ty:0,tol:.24},
 {key:'up',label:'위',title:'턱을 살짝 들어 주세요',hint:'고개를 옆으로 돌리지 말고 위쪽만 천천히',hold:680,min:6,tx:0,ty:-.50,tol:.30},
 {key:'down',label:'아래',title:'턱을 살짝 내려 주세요',hint:'마지막입니다 · 아래쪽만 천천히',hold:680,min:6,tx:0,ty:.50,tol:.30}
],names=['정면','오른쪽','왼쪽','위','아래'];`);
  h=h.replace(/function directionHint\(q\)\{.*?\}\nfunction arrowForStep/s,`function directionHint(q){if(!q)return'얼굴을 찾는 중…';if(!inside)return'얼굴을 타원 중앙에 맞춰주세요';if(poseReady(q))return'좋아요 · 잠깐 그대로 유지하세요';if(idx===0)return'정면을 바라보고 움직이지 마세요';const z=poseDistance(q);if(Math.abs(z.dx)>Math.abs(z.dy)){if(Math.abs(z.dx)<.16)return'거의 맞았습니다 · 조금만 더';return z.dx>0?'화면 오른쪽으로 조금 더':'화면 왼쪽으로 조금 더'}if(Math.abs(z.dy)<.15)return'거의 맞았습니다 · 조금만 더';return z.dy>0?'턱을 조금 더 내려주세요':'턱을 조금 더 올려주세요'}\nfunction arrowForStep`);
  const css=`<style>
  .target,.cursor{display:none!important}.scanner{width:74%!important;height:52%!important}.copy{top:24px!important}.step{font-size:17px!important}.title{font-size:clamp(30px,8.5vw,39px)!important}.hint{max-width:90%!important}.fb{min-width:245px!important;background:#080b1192!important;border-color:#ffffff25!important;box-shadow:0 8px 28px #0004!important}.rail:before{content:"";position:absolute;top:15px;left:10%;right:10%;height:1px;background:#ffffff2e;z-index:-1}.rail{left:26px!important;right:26px!important}.dot{background:#101318aa!important;backdrop-filter:blur(8px)}
  .faceGuide{width:64%!important;height:80%!important;border:1.7px solid #ffffff4d!important;transition:transform .16s linear,width .16s linear,border-color .25s,box-shadow .25s!important;transform-style:preserve-3d;will-change:transform,width}.ui.ok .faceGuide{border-color:#dceaff!important;box-shadow:0 0 0 1px #70a7ff44,0 0 30px #5c96ff35,inset 0 0 30px #72a8ff0d!important}
  .moveArrow{left:50%!important;top:50%!important;font-size:56px!important;color:#edf4ff!important;opacity:.95!important;filter:drop-shadow(0 3px 14px #397cf2aa)!important;animation:p14cue 1.05s ease-in-out infinite!important}.ui.ok .moveArrow{opacity:.16!important}@keyframes p14cue{50%{transform:translate(-50%,-50%) translate(var(--cx,0),var(--cy,0)) scale(1.05)}}
  .guideArc{fill:none;stroke:#9bc2ff;stroke-width:5.5;stroke-linecap:round;stroke-dasharray:13 87;filter:drop-shadow(0 0 8px #4d8fffcc);transition:transform .5s cubic-bezier(.2,.8,.2,1),stroke .25s;transform-box:view-box;transform-origin:50px 70px;animation:p14arc 1.25s ease-in-out infinite}@keyframes p14arc{50%{stroke:#e1ecff;filter:drop-shadow(0 0 13px #5f9bffff)}}.ui.done .guideArc{opacity:0}
  </style>`;
  h=h.replace('</style>',css+'</style>');
  h=h.replace('<ellipse class="ring" id="ring" pathLength="100" cx="50" cy="70" rx="44" ry="63" transform="rotate(-90 50 70)"/></svg>','<ellipse class="ring" id="ring" pathLength="100" cx="50" cy="70" rx="44" ry="63" transform="rotate(-90 50 70)"/><ellipse class="guideArc" id="guideArc" pathLength="100" cx="50" cy="70" rx="44" ry="63" transform="rotate(-90 50 70)"/></svg>');
  const patch=`<script>(()=>{const A=[-90,0,180,-90,90],AR=['•','→','←','↑','↓'];function u(){const st=document.getElementById('step')?.textContent||'',m=st.match(/([1-5]) \/ 5/),i=m?+m[1]-1:0,a=document.getElementById('guideArc'),ar=document.getElementById('moveArrow'),fg=document.querySelector('.faceGuide'),d=document.getElementById('diagnostics')?.textContent||'';if(a)a.setAttribute('transform','rotate('+A[i]+' 50 70)');if(ar){ar.textContent=AR[i];ar.style.setProperty('--cx',((i===1?18:i===2?-18:0))+'px');ar.style.setProperty('--cy',((i===3?-14:i===4?14:0))+'px')}const mm=d.match(/yaw (-?\\d+\\.\\d+) · pitch (-?\\d+\\.\\d+)/);if(fg&&mm){const yaw=Math.max(-1,Math.min(1,-parseFloat(mm[1])/.115)),pitch=Math.max(-1,Math.min(1,parseFloat(mm[2])/.085)),w=64-Math.abs(yaw)*8.5;fg.style.width=w+'%';fg.style.transform='translate(-50%,-50%) perspective(420px) rotateY('+(-yaw*24)+'deg) rotateX('+(pitch*10)+'deg)'}}setInterval(u,80);u()})()<\/script>`;
  h=h.replace('</body>',patch+'</body>');
  document.open();document.write(h);document.close();
})().catch(e=>{document.body.innerHTML='<pre style="white-space:pre-wrap;padding:20px;font:16px system-ui">P14.1 load error\n'+String(e)+'</pre>'});
</script></body></html>
