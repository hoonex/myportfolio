name: Harden Vision mobile touch once

on:
  push:
    branches:
      - feat/design-journal-liquid-glass-20260827
    paths:
      - '.github/workflows/harden-vision-mobile-touch-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/design-journal-liquid-glass-20260827
          fetch-depth: 0
      - name: Enforce mobile touch targets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('site/journal-v11-vision.css')
          text = path.read_text()
          old = '.vision-command-v11{padding:10px;border-radius:22px}.vision-command-main-v11{display:grid;grid-template-columns:1fr 1fr}'
          new = '.vision-command-v11{padding:10px;border-radius:22px}.vision-command-v11 button,.vision-toggle-v11 span{min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center}.vision-command-main-v11{display:grid;grid-template-columns:1fr 1fr}'
          if text.count(old) != 1:
              raise SystemExit('unexpected mobile CSS anchor count')
          path.write_text(text.replace(old, new, 1))
          PY
          python .github/scripts/validate-runtime.py
          git diff --check
      - name: Commit mobile touch fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/harden-vision-mobile-touch-once.yml
          git add site/journal-v11-vision.css
          git commit -m "fix: enlarge Vision mobile touch targets"
          git push origin HEAD:feat/design-journal-liquid-glass-20260827
