<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0c0e" />
  <meta name="description" content="HJ — interface experiments, tools, and notes." />
  <title>HJ — Design Journal</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./journal-v2.css" />
  <link rel="stylesheet" href="./journal-v3-refraction.css" />
  <link rel="stylesheet" href="./journal-v4-jelly.css" />
  <link rel="stylesheet" href="./journal-v5-experiments.css" />
  <link rel="stylesheet" href="./journal-v6-studio.css" />
  <link rel="stylesheet" href="./journal-v6-compat.css" />
</head>
<body>
  <svg class="svg-defs" aria-hidden="true" width="0" height="0">
    <defs>
      <filter id="liquid-edge" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.008 0.018" numOctaves="2" seed="7" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="B" result="displaced" />
        <feGaussianBlur in="displaced" stdDeviation="0.25" />
      </filter>
    </defs>
  </svg>

  <div class="ambient" aria-hidden="true">
    <div class="ambient-orb ambient-orb-a"></div>
    <div class="ambient-orb ambient-orb-b"></div>
    <div class="ambient-grid"></div>
  </div>

  <header class="topbar-wrap">
    <nav class="topbar glass" aria-label="주요 메뉴">
      <a class="brand" href="#/" aria-label="홈">
        <span class="brand-mark">HJ</span>
        <span class="brand-status">Design journal</span>
      </a>
      <div class="topbar-links">
        <a href="#/" data-nav="home">Index</a>
        <a href="#/lab" data-nav="lab">Glass Lab</a>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="테마 전환">
          <span class="theme-toggle-track"><span class="theme-toggle-thumb"></span></span>
        </button>
      </div>
    </nav>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="site-footer">
    <div>
      <span>HJ</span>
      <span class="muted">Interface experiments, 2026</span>
    </div>
    <div class="footer-links">
      <a href="https://github.com/hoonex" target="_blank" rel="noreferrer">GitHub</a>
      <a href="#/lab">Glass Lab</a>
    </div>
  </footer>

  <script src="./app.js" defer></script>
  <script src="./journal-v2.js" defer></script>
  <script src="./journal-v3-refraction.js" defer></script>
  <script src="./journal-runtime.js" defer></script>
  <script src="./journal-v4-jelly.js" defer></script>
  <script src="./journal-v5-experiments.js" defer></script>
  <script src="./journal-v6-studio.js" defer></script>
  <script src="./journal-v7-input-continuity.js" defer></script>
</body>
</html>
