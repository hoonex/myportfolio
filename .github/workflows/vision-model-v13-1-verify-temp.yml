name: Temporary Vision model v13.1 verification

on:
  push:
    branches:
      - fix/vision-model-runtime-v13-1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check journal-v13-vision.js
          node --check journal-route-loader.js

      - name: Vision ownership contract
        shell: python
        run: |
          import json
          from pathlib import Path
          src=Path('journal-v13-vision.js').read_text()
          loader=Path('journal-route-loader.js').read_text()
          index=Path('index.html').read_text()
          manifest=json.loads(Path('runtime-manifest.json').read_text())
          route=[r for r in manifest['routes'] if r['id']=='vision']
          assert len(route)==1 and route[0]['paths']==['/lab/vision']
          assert route[0]['scripts']==['journal-v13-vision.js']
          assert 'HandLandmarker' in src and 'FaceLandmarker' in src
          assert 'GestureRecognizer' not in src
          assert 'Promise.allSettled' in src
          assert "handTask.detectForVideo" in src and "faceTask.detectForVideo" in src
          assert "recover(kind)" in src and "createTask(kind,true)" in src
          rev='SITE29-VISION13_1-20260911-1645'
          assert rev in loader and rev in index
          print('vision ownership contract: ok')

      - name: MediaPipe runtime and model endpoints
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs'
            'https://unpkg.com/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs'
            'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'
            'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task'
          )
          for url in "${urls[@]}"; do
            echo "checking $url"
            curl --fail --silent --show-error --location --head --max-time 20 "$url" >/dev/null
          done
