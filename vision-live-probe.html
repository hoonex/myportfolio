function tone(freq){try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.value=freq;g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.18,audioCtx.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.24);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.26)}catch(e){recordError(e)}}
function drawPiano(hands,t,w,h){const top=h*.68,keyH=h-top,n=NOTES.length,keyW=w/n;for(let i=0;i<n;i++){ctx.fillStyle=i%2?'rgba(235,242,248,.82)':'rgba(255,255,255,.9)';ctx.fillRect(i*keyW,top,keyW-2,keyH);ctx.strokeStyle='rgba(8,12,16,.7)';ctx.lineWidth=2;ctx.strokeRect(i*keyW,top,keyW-2,keyH);ctx.fillStyle='#111';ctx.font=`800 ${Math.max(11,w/48)}px ui-monospace,monospace`;ctx.fillText(NAMES[i],i*keyW+keyW*.38,h-18)}let hits=[];for(let hi=0;hi<(hands||[]).length;hi++){const lm=hands[hi];if(lm?.length!==21)continue;const P=lm.map(p=>project(p,t,w));path(HAND_CONNECTIONS,P,'#ffd84d',Math.max(3,w/150));for(const tip of [8,12]){const p=P[tip];ctx.beginPath();ctx.arc(p.x,p.y,Math.max(7,w/90),0,Math.PI*2);ctx.fillStyle='#ff9f35';ctx.fill();if(p.y>=top&&p.y<h){const k=clamp(Math.floor(p.x/keyW),0,n-1),id=`${hi}-${tip}-${k}`,now=performance.now(),last=pianoCooldown.get(id)||0;if(now-last>220){pianoCooldown.set(id,now);tone(NOTES[k]);hits.push(NAMES[k]);ctx.fillStyle='rgba(105,255,176,.45)';ctx.fillRect(k*keyW,top,keyW-2,keyH)}}}}set('result',hits.length?`PIANO · ${hits.join(' ')}`:'PIANO · 손끝으로 건반을 눌러보세요',hits.length?'ok':'');set('gesture',hits.join(' ')||'piano')}
function render(){const {w,h,t}=drawFrame();if(!t)return;if(mode==='scan')drawScan(lastFace,t,w,h);else if(mode==='avatar'){drawBaseTracking(null,lastHands,t,w);drawAvatar(lastFace,t,w,h)}else if(mode==='magic'){drawBaseTracking(lastFace,null,t,w);drawMagic(lastHands,t,w,h)}else if(mode==='piano'){drawBaseTracking(lastFace,null,t,w);drawPiano(lastHands,t,w,h)}ctx.font=`800 ${Math.max(11,w/48)}px ui-monospace,monospace`;ctx.fillStyle='rgba(0,0,0,.62)';ctx.fillRect(12,h-45,Math.min(w-24,w*.76),31);ctx.fillStyle='#b7ffda';ctx.fillText(`${mode.toUpperCase()} · FACE ${lastFace?.length||0} · HAND ${lastHands.length}`,22,h-24)}
async function makeTasks(){if(rebuilding)return;rebuilding=true;try{try{faceTask?.close?.()}catch{}try{handTask?.close?.()}catch{}faceTask=await vision.FaceLandmarker.createFromOptions(fileset,{baseOptions:{modelAssetPath:FACE_MODEL},runningMode:'IMAGE',numFaces:1,minFaceDetectionConfidence:.5,minFacePresenceConfidence:.5,minTrackingConfidence:.5});handTask=await vision.HandLandmarker.createFromOptions(fileset,{baseOptions:{modelAssetPath:HAND_MODEL},runningMode:'IMAGE',numHands:2,minHandDetectionConfidence:.45,minHandPresenceConfidence:.45,minTrackingConfidence:.45});set('error','none','ok')}finally{rebuilding=false}}
async function recover(e){recordError(e);if(rebuilding)return;set('state','RECOVERING MODELS','warn');try{await makeTasks();set('state','LIVE · PLAYGROUND','ok')}catch(x){recordError(x);set('state','RECOVERY FAILED','err')}}
function loop(now){if(!running)return;if(faceTask&&handTask&&!rebuilding&&video.readyState>=2&&now-lastDetect>=105&&ensureBuffers()){lastDetect=now;const begun=performance.now();try{sctx.drawImage(video,0,0,source.width,source.height);ictx.drawImage(source,0,0,infer.width,infer.height);const fr=faceTask.detect(infer),hr=handTask.detect(infer);detectRuns++;lastFace=fr?.faceLandmarks?.[0]||null;lastHands=hr?.landmarks||[];lastHandedness=hr?.handedness||[];set('face',lastFace?`${lastFace.length} pts`:'0',lastFace?'ok':'');set('hands',`${lastHands.length} hand${lastHands.length===1?'':'s'}`,lastHands.length?'ok':'');set('tracking',`F${lastFace?1:0} · H${lastHands.length}`,(lastFace||lastHands.length)?'ok':'');set('timing',`${(performance.now()-begun).toFixed(0)} ms`)}catch(e){invalid++;recover(e)}}render();requestAnimationFrame(loop)}
async function init(){try{set('state','loading face + hand');vision=await import(MOD);fileset=await vision.FilesetResolver.forVisionTasks(WASM);await makeTasks();set('state','models ready · CPU IMAGE','ok');set('result','SCAN · 카메라를 시작하세요');start.disabled=false;start.textContent='전면카메라 시작'}catch(e){recordError(e);set('state','MODEL ERROR','err')}}
start.addEventListener('click',async()=>{try{start.disabled=true;set('state','requesting camera');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'user'},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30,max:30}}});video.srcObject=stream;await video.play();ensureBuffers();if(!audioCtx)try{audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch{}set('state','LIVE · PLAYGROUND','ok');running=true;requestAnimationFrame(loop);start.textContent='실행 중'}catch(e){start.disabled=false;recordError(e);set('state','CAMERA ERROR','err')}});
document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('active',x===b));$('help').textContent=HELP[mode];particles.length=rings.length=beams.length=0;if(audioCtx)audioCtx.resume();render()}));
resetBtn.addEventListener('click',()=>{particles.length=rings.length=beams.length=0;pianoCooldown.clear();set('gesture','--');set('result',`${mode.toUpperCase()} · reset`);render()});
addEventListener('beforeunload',()=>{stream?.getTracks().forEach(t=>t.stop());try{faceTask?.close?.();handTask?.close?.()}catch{}});init();
</script></body></html>
