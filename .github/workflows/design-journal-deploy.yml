name: Deploy Design Journal

on:
  workflow_run:
    workflows:
      - Design Journal CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: design-journal-gh-pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout exact validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Validate canonical runtime before publish
        run: |
          test -n "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python - <<'PY'
          from pathlib import Path
          import json, re, subprocess

          root = Path('site')
          manifest = json.loads((root / 'runtime-manifest.json').read_text())
          html = (root / 'index.html').read_text()
          styles = re.findall(r'<link[^>]+href="\./([^"?#]+\.css)', html)
          scripts = re.findall(r'<script\s+src="\./([^"?#]+\.js)"', html)

          if styles != manifest['styles']:
              raise SystemExit(f'style order drift: html={styles} manifest={manifest["styles"]}')
          if scripts != manifest['scripts']:
              raise SystemExit(f'script order drift: html={scripts} manifest={manifest["scripts"]}')

          for rel in manifest['styles'] + manifest['scripts']:
              if not (root / rel).is_file():
                  raise SystemExit(f'missing runtime asset: {rel}')
          for rel in manifest['scripts']:
              subprocess.run(['node', '--check', str(root / rel)], check=True)

          print('canonical runtime manifest validated')
          PY
          test -f site/.nojekyll || touch site/.nojekyll

      - name: Materialize gh-pages worktree
        run: |
          git fetch origin gh-pages
          git worktree add /tmp/design-journal-pages origin/gh-pages

      - name: Sync site into deployment root
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            site/ /tmp/design-journal-pages/
          touch /tmp/design-journal-pages/.nojekyll

      - name: Publish gh-pages
        working-directory: /tmp/design-journal-pages
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No deployment changes.'
            exit 0
          fi
          git commit -m "deploy: sync design journal from ${SOURCE_SHA::12}"
          git push origin HEAD:gh-pages
