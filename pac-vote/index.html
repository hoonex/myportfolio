<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6fa"><meta name="description" content="PAC 2026 팀원 3명 분과 선택 투표">
<title>PAC 2026 · 팀 분과 투표</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#17233c;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
main{max-width:770px;margin:auto;padding:24px 17px 80px}.bar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:0 0 33px}.brand{font-size:12px;font-weight:900;letter-spacing:.13em;color:#315fd2}.share{background:#fff;border:1px solid #dfe5ed;border-radius:999px;padding:9px 14px;color:#395072;font-size:12px;font-weight:700}
.eyebrow{font-size:12px;letter-spacing:.12em;font-weight:900;color:#325fcd}.hero{font-size:clamp(29px,6vw,45px);letter-spacing:-.06em;line-height:1.18;margin:13px 0;font-weight:850}.sub{line-height:1.8;font-size:15px;color:#69748a}.panel{background:white;border:1px solid #e4e9f2;border-radius:20px;padding:25px;box-shadow:0 8px 24px rgba(40,65,100,.035)}h2{font-size:clamp(21px,4.4vw,28px);letter-spacing:-.05em;margin:4px 0 8px;line-height:1.4}.help{font-size:13px;line-height:1.65;color:#778399;margin:6px 0 18px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:22px 0}.info{padding:18px;border-radius:13px;border:1px solid #e2e7ee;background:#f6f9ff}.info.other{background:#f8f6ff}.info strong{display:block;font-size:15px;margin-bottom:9px}.info p{font-size:13px;color:#65738b;line-height:1.65;margin:0}
.input{width:100%;background:#fafbff;color:#16243f;border:1.5px solid #dce3ef;border-radius:12px;padding:13px 14px;outline:none}.input:focus{border-color:#3867d6}textarea{min-height:100px;resize:vertical}.choices{display:grid;gap:9px;margin:20px 0}.choice{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:15px 13px;border-radius:12px;border:1.5px solid #e0e6ef;background:#fbfcff;color:#263954;line-height:1.55}.choice[aria-pressed="true"]{border-color:#3467e8;background:#eff4ff;color:#164bbd;font-weight:700}.dot{width:23px;height:23px;flex:none;border:1px solid #d4dbe6;background:#fff;border-radius:50%;display:grid;place-items:center;font-size:12px;color:transparent}.choice[aria-pressed="true"] .dot{background:#3265e2;border-color:#3265e2;color:white}
.nav{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:22px}.btn{border:0;border-radius:11px;background:#3265e2;color:#fff;font-weight:800;padding:13px 17px}.btn.ghost{background:#eef2f8;color:#334a6b}.btn.primary{margin-left:auto}.btn:focus-visible,.choice:focus-visible,.share:focus-visible{outline:3px solid #b3c7fb;outline-offset:2px}
.progress{height:5px;border-radius:99px;background:#e7edf7;margin:15px 0 25px;overflow:hidden}.progress span{height:100%;display:block;background:#3265e2;transition:width .2s}.step{font-size:13px;color:#748095;text-align:right}.error{color:#a72338;font-size:13px;line-height:1.6;min-height:15px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:20px 0}.stats div{background:#f2f5fc;border-radius:12px;padding:17px 7px;text-align:center}.stats strong{font-size:28px;color:#2f60d9;display:block}.stats small{font-size:11px;color:#64748e;line-height:1.5}.person{padding:17px 0;border-bottom:1px solid #e7ecf4}.person:last-of-type{border:0}.person h3{font-size:16px;margin:0 0 6px}.person p{font-size:13px;color:#4e5c75;line-height:1.7;overflow-wrap:anywhere}.tag{display:inline-block;background:#eef3ff;border-radius:20px;font-size:11px;color:#2e5bc7;padding:4px 8px}.fine{font-size:12px;color:#7c8799;line-height:1.7;margin-top:20px}
@media(max-width:520px){main{padding:20px 14px 60px}.bar{margin-bottom:26px}.panel{padding:19px 16px}.twocol{grid-template-columns:1fr}.hero{font-size:34px}.share{max-width:145px}}
</style>
</head><body><main><header class="bar"><span class="brand">PAC 2026 / TEAM VOTE</span><button type="button" id="share" class="share">팀 링크 복사 ↗</button></header><div id="app" aria-live="polite"></div></main>
<script>
"use strict";
const API_URL="https://eicwcohfrvhwimwevzkd.supabase.co/rest/v1/rpc/pac_2026_vote",API_KEY="sb_publishable_-9Cf0yVjLWf88pcvAqQ-EQ_YN9v3Obz";
const questions=[
{title:"이번 대회에서 가장 하고 싶은 경험은?",options:["실물 로봇을 직접 연결하고 제어하기","알고리즘·시뮬레이션·웹 개발하기","둘 다 비슷하게 관심 있음"]},
{title:"대회 후 어떤 결과물을 남기고 싶어?",options:["실제 로봇 미션 성공 경험과 영상","계속 개발할 수 있는 소프트웨어","둘 다 상관없음"]},
{title:"어떤 어려움이 더 감당할 만해?",options:["현장에서 처음 받은 로봇을 연결·보정하기","사전에 소프트웨어를 개발하고 발표로 입증하기","둘 다 괜찮음"]},
{title:"어느 쪽 준비에 시간을 더 쓸 수 있어?",options:["분과① 로봇 제어 준비 + 현장 실물 작업","분과② 알고리즘·시뮬레이션 + 발표","두 과제 모두 비슷함","어느 쪽이든 시간이 부족할 것 같음"]},
{title:"내가 맡고 싶은 역할은?",multi:true,options:["로봇 제어·카메라·좌표 보정","적재 알고리즘·최적화","물리 시뮬레이션·3D 개발","웹사이트·UI 개발","실험·테스트·오류 분석","자료조사·발표·PPT","팀 상황에 맞춰 조정 가능"]},
{title:"가장 걱정되는 부분은?",multi:true,max:2,options:["분과① 현장 로봇 연결·동작 실패","분과② 개발·시뮬레이션 미완성","준비시간 부족","역할 분담·협업","발표·질의응답","선발·입상 불확실성","특별히 걱정되는 부분 없음"]},
{title:"현재 원하는 분과는?",options:["분과① · 파티션 블록 적재","분과② · Mixed Palletizing","아직 결정하지 못함"]},
{title:"그렇게 고른 이유는?",kind:"text",help:"한두 문장이면 충분해. 3명이 모두 제출하면 공개돼."},
{title:"다른 분과로 정해져도 참여할 수 있어?",options:["참여 가능","조건에 따라 가능","참여 어려움"],extra:true,help:"참여 조건이나 이유가 있다면 아래에 적어줘."}
];
const app=document.getElementById("app"),alphabet="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",qs=new URLSearchParams(location.search);
function newRoom(){const b=new Uint8Array(10);crypto.getRandomValues(b);return [...b].map(x=>alphabet[x%alphabet.length]).join("")}
let room=qs.get("room");
if(!room||!/^[A-Z2-9]{10}$/.test(room)){room=newRoom();history.replaceState(null,"",location.pathname+"?room="+room)}
let storage={};try{storage=JSON.parse(localStorage.getItem("pacvote:"+room)||"{}")}catch(_){}
let voter=storage.voter||crypto.randomUUID(),name=storage.name||"",answers=Array.isArray(storage.answers)&&storage.answers.length===9?storage.answers:Array(9).fill(null),extra=storage.extra||"",submitted=!!storage.submitted,step=-1,busy=false;
function save(){try{localStorage.setItem("pacvote:"+room,JSON.stringify({voter:voter,name:name,answers:answers,extra:extra,submitted:submitted}))}catch(_){}}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function btn(label,action,cls){const b=document.createElement("button");b.type="button";b.className="btn "+(cls||"");b.textContent=label;b.addEventListener("click",action);return b}
function put(html){app.innerHTML=html}
function buttons(items){const row=document.getElementById("nav");items.forEach(i=>row.append(btn(i[0],i[1],i[2])))}
function landing(){step=-1;put('<p class="eyebrow">팀원 3명이 각자 선택하는 투표</p><h1 class="hero">우리 팀,<br>어느 분과로 갈까?</h1><p class="sub">팀원별로 약 2분. 모두 제출한 뒤 결과와 선택 이유를 같이 확인해.</p><div class="twocol"><div class="info"><strong>① 파티션 블록 적재</strong><p>현장에서 제공되는 실물 로봇으로 블록을 찾아 집고 넣는 과제. 제어·캘리브레이션·시연 성공률이 핵심.</p></div><div class="info other"><strong>② Mixed Palletizing</strong><p>순서가 정해지지 않은 박스의 위치를 계산하는 소프트웨어 미션. 적재·로봇 검증·발표가 핵심.</p></div></div><section class="panel"><h2>이름 또는 별명</h2><p class="help">팀원들이 알아볼 정도로만 적어줘. 같은 링크로 들어와야 결과가 합쳐져.</p><input id="nickname" class="input" maxlength="20" placeholder="이름 / 별명" autocomplete="nickname" value="'+esc(name)+'"><p id="err" class="error"></p><div id="nav" class="nav"></div></section><p class="fine">사적인 팀 의견 수렴용 투표야. 링크를 아는 사람은 결과를 볼 수 있고 본인 인증은 하지 않아. 주민번호·전화번호 등 개인정보는 입력하지 마.</p>');buttons([[submitted?"내 투표 결과 보기":"투표 시작하기",()=>{const n=document.getElementById("nickname").value.trim();if(!n){document.getElementById("err").textContent="별명을 입력해 줘.";return}name=n;save();if(submitted)status();else{step=0;question()}}, "primary"],["결과 확인",status,"ghost"]])}
function valid(){const q=questions[step],a=answers[step];if(q.kind==="text")return typeof a==="string"&&a.trim().length>0;if(q.multi)return Array.isArray(a)&&a.length>0&&(!q.max||a.length<=q.max);return Number.isInteger(a)&&a>=0&&a<q.options.length}
function question(){const q=questions[step];if(!q){landing();return}let out='<p class="step">'+(step+1)+' / 9</p><div class="progress"><span style="width:'+Math.round((step+1)/9*100)+'%"></span></div><section class="panel"><h2>'+esc(q.title)+'</h2><p class="help">'+esc(q.help||(q.multi?(q.max?"최대 "+q.max+"개까지 골라줘.":"여러 개 골라도 돼."):"가장 가까운 항목 하나를 골라줘."))+'</p>';if(q.kind==="text"){out+='<textarea id="free" class="input" maxlength="500" placeholder="내 생각을 적어줘">'+esc(answers[step]||"")+'</textarea>'}else{out+='<div class="choices">'+q.options.map((o,i)=>{const on=q.multi?Array.isArray(answers[step])&&answers[step].includes(i):answers[step]===i;return '<button type="button" class="choice" data-choice="'+i+'" aria-pressed="'+on+'"><span class="dot">✓</span><span>'+esc(o)+'</span></button>'}).join("")+'</div>'}if(q.extra)out+='<textarea id="extra" class="input" maxlength="500" placeholder="참여 조건·이유 (선택)">'+esc(extra)+'</textarea>';out+='<p id="err" class="error"></p><div id="nav" class="nav"></div></section>';put(out);if(q.kind==="text")document.getElementById("free").addEventListener("input",e=>{answers[step]=e.target.value;save()});else app.querySelectorAll("[data-choice]").forEach(b=>b.addEventListener("click",()=>{const i=Number(b.dataset.choice);if(q.multi){let a=Array.isArray(answers[step])?[...answers[step]]:[];if(a.includes(i))a=a.filter(x=>x!==i);else if(q.max&&a.length>=q.max){document.getElementById("err").textContent="최대 "+q.max+"개까지 선택할 수 있어.";return}else a.push(i);answers[step]=a}else answers[step]=i;save();question()}));if(q.extra)document.getElementById("extra").addEventListener("input",e=>{extra=e.target.value;save()});buttons([["이전",()=>{step--;step<0?landing():question()},"ghost"],[step===8?"투표 제출":"다음",()=>{if(!valid()){document.getElementById("err").textContent="이 질문에 답해줘.";return}step===8?submit(): (step++,question())},"primary"]])}
async function api(data){const res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json","apikey":API_KEY},body:JSON.stringify(data),cache:"no-store"});let payload;try{payload=await res.json()}catch(_){throw Error("응답을 읽을 수 없어. 잠시 뒤 다시 시도해 줘.")}if(!res.ok){const code=payload.message||"";if(code==="room_full")throw Error("이미 3명이 투표한 방이야. 팀장에게 링크를 확인해 줘.");if(code==="duplicate_name_or_vote")throw Error("같은 이름의 투표가 있어. 다른 별명으로 제출해 줘.");throw Error("투표 서버 연결 오류: "+code)}return payload}
async function submit(){if(busy)return;busy=true;put('<section class="panel"><h2>제출 중…</h2><p class="sub">투표를 저장하고 있어.</p></section>');try{const result=await api({p_room:room,p_voter:voter,p_name:name,p_answers:answers,p_extra:extra});submitted=true;save();busy=false;showState(result)}catch(e){busy=false;put('<section class="panel"><h2>제출하지 못했어</h2><p class="error">'+esc(e.message)+'</p><div id="nav" class="nav"></div></section>');buttons([["다시 제출",submit,"primary"],["이전 질문",question,"ghost"]])}}
async function status(){put('<section class="panel"><h2>결과 확인 중…</h2></section>');try{showState(await api({p_room:room}))}catch(e){put('<section class="panel"><h2>결과를 확인하지 못했어</h2><p class="error">'+esc(e.message)+'</p><div id="nav" class="nav"></div></section>');buttons([["다시 확인",status,"primary"],["처음으로",landing,"ghost"]])}}
function showState(data){if(!data.complete){put('<p class="eyebrow">현재 제출 인원</p><h1 class="hero">'+Number(data.count)+'/3명</h1><p class="sub">3명이 모두 제출하면 각자의 선택과 이유가 공개돼.</p><section class="panel"><h2>다른 팀원 응답 기다리는 중</h2><p class="help">팀 링크를 단톡방에 공유해 줘.</p><div id="nav" class="nav"></div></section>');buttons([["팀 링크 복사",share,"primary"],["새로고침",status,"ghost"]]);return}results(data.ballots||[])}
function results(ballots){const names=["① 파티션 블록 적재","② Mixed Palletizing","미정"],counts=[0,0,0];ballots.forEach(b=>{let n=b.answers&&b.answers[6];if(Number.isInteger(n)&&n>=0&&n<=2)counts[n]++});let out='<p class="eyebrow">3명 모두 제출 완료</p><h1 class="hero">우리 팀 투표 결과</h1><p class="sub">표 수와 각자의 이유를 함께 보고 결정하자.</p><section class="panel"><div class="stats">'+counts.map((n,i)=>'<div><strong>'+n+'</strong><small>'+names[i]+'</small></div>').join("")+'</div><h2>팀원별 응답</h2>';ballots.forEach(b=>{const a=b.answers||[];out+='<article class="person"><h3>'+esc(b.name)+' <span class="tag">'+esc(names[a[6]]||"미정")+'</span></h3><p><b>선택 이유</b><br>'+esc(a[7]||"")+'</p><p><b>맡고 싶은 역할</b><br>'+esc((a[4]||[]).map(i=>questions[4].options[i]).filter(Boolean).join(" · "))+'</p><p><b>걱정되는 점</b><br>'+esc((a[5]||[]).map(i=>questions[5].options[i]).filter(Boolean).join(" · "))+'</p><p><b>다른 분과 참여</b> · '+esc(questions[8].options[a[8]]||"")+ (b.extra?" — "+esc(b.extra):"")+'</p></article>'});out+='<div id="nav" class="nav"></div></section><p class="fine">선호를 확인하는 팀 내 의견 수렴 도구야. 결과를 점수나 자동 결정으로 취급하지 않아.</p>';put(out);buttons([["결과 복사",()=>{const txt=ballots.map(b=>[b.name,names[b.answers[6]],"이유: "+b.answers[7],"역할: "+(b.answers[4]||[]).map(i=>questions[4].options[i]).join(", "),"다른 분과: "+questions[8].options[b.answers[8]]].join("\n")).join("\n\n");navigator.clipboard.writeText(txt).then(()=>alert("결과 복사 완료")).catch(()=>prompt("이 내용을 복사해 줘",txt))},"primary"],["새로고침",status,"ghost"]])}
function share(){const url=location.origin+location.pathname+"?room="+room;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(()=>{document.getElementById("share").textContent="복사 완료 ✓";setTimeout(()=>document.getElementById("share").textContent="팀 링크 복사 ↗",1900)}).catch(()=>prompt("팀 링크를 복사해 줘",url))}else prompt("팀 링크를 복사해 줘",url)}
document.getElementById("share").addEventListener("click",share);if(submitted)status();else landing();
</script>
</body></html>
