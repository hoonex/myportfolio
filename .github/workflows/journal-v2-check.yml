name: Journal v2 check

on:
  push:
    branches:
      - feat/design-journal-liquid-glass-20260827

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check site/app.js
          node --check site/journal-v2.js
      - name: Check deployment references
        run: |
          grep -q 'journal-v2.css' site/index.html
          grep -q 'journal-v2.js' site/index.html
          test -s site/journal-v2.css
          test -s site/journal-v2.js
