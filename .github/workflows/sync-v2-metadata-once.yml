name: Sync v2 metadata once

on:
  push:
    branches:
      - feat/design-journal-liquid-glass-20260827
    paths:
      - .github/workflows/sync-v2-metadata-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/design-journal-liquid-glass-20260827
          fetch-depth: 0
      - name: Canonicalize legacy article metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'site/journal-v2.js';
          const authority = fs.readFileSync('site/journal-v12-authority.js', 'utf8');
          const authorityMatch = authority.match(/const EDITIONS = (\{[\s\S]*?\});\n\n  const route/);
          if (!authorityMatch) throw new Error('could not read canonical EDITIONS from v12 authority');
          const editions = Function(`"use strict"; return (${authorityMatch[1]});`)();

          const original = fs.readFileSync(path, 'utf8');
          const articlesStart = original.indexOf('  const articles = {');
          const articlesEnd = original.indexOf('\n  const presets = {', articlesStart);
          if (articlesStart < 0 || articlesEnd < 0) throw new Error('could not isolate articles object');

          let section = original.slice(articlesStart, articlesEnd);
          const top = [...section.matchAll(/^    (glass|sloar|motion):\s*\{$/gm)];
          const names = top.map(match => match[1]);
          if (JSON.stringify(names) !== JSON.stringify(['glass','sloar','motion'])) {
            throw new Error(`unexpected article block layout: ${JSON.stringify(names)}`);
          }

          const escapeSingle = value => String(value).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
          let rebuilt = '';
          let cursor = 0;
          for (let index = 0; index < top.length; index += 1) {
            const match = top[index];
            const slug = match[1];
            const start = match.index;
            const end = index + 1 < top.length ? top[index + 1].index : section.length;
            let block = section.slice(start, end);
            for (const lang of ['ko','en','ja']) {
              const copy = editions[lang]?.[slug];
              if (!copy) throw new Error(`missing canonical copy for ${slug}/${lang}`);
              const pattern = new RegExp(`^      ${lang}:\\{category:'[^\\n]*\\},$`, 'm');
              const old = block.match(pattern);
              if (!old) throw new Error(`missing v2 metadata line for ${slug}/${lang}`);
              const date = old[0].match(/date:'([^']*)'/)?.[1];
              const reading = old[0].match(/reading:'([^']*)'/)?.[1];
              if (date == null || reading == null) throw new Error(`missing date/reading for ${slug}/${lang}`);
              const line = `      ${lang}:{category:'${escapeSingle(copy.category)}',date:'${escapeSingle(date)}',reading:'${escapeSingle(reading)}',title:'${escapeSingle(copy.title)}',deck:'${escapeSingle(copy.deck)}',lede:'${escapeSingle(copy.lede)}'},`;
              block = block.replace(pattern, line);
            }
            rebuilt += section.slice(cursor, start) + block;
            cursor = end;
          }
          rebuilt += section.slice(cursor);
          const updated = original.slice(0, articlesStart) + rebuilt + original.slice(articlesEnd);
          fs.writeFileSync(path, updated);

          for (const lang of ['ko','en','ja']) {
            for (const slug of ['glass','sloar','motion']) {
              const copy = editions[lang][slug];
              for (const field of ['category','title','deck','lede']) {
                if (!updated.includes(copy[field])) throw new Error(`canonical ${slug}/${lang}/${field} missing after rewrite`);
              }
            }
          }
          if (updated.includes("title:'Liquid Glass は frosted glass ではない。'")) {
            throw new Error('legacy Japanese Glass title remains in v2 metadata');
          }
          NODE
          node --check site/journal-v2.js
          git diff --check
          git diff -- site/journal-v2.js
      - name: Commit canonical source and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sync-v2-metadata-once.yml
          git add site/journal-v2.js
          git commit -m "fix: canonicalize legacy article metadata source"
          git push origin HEAD:feat/design-journal-liquid-glass-20260827
