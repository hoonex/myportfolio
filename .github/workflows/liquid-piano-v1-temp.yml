name: Temporary Liquid Glass Piano v1 verify
on:
  push:
    branches:
      - feat/liquid-glass-piano-v1
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and route contracts
        run: |
          node --check journal-v15-liquid-piano.js
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('runtime-manifest.json').read_text())
          piano=[r for r in manifest['routes'] if r.get('id')=='liquid-piano']
          assert len(piano)==1
          assert piano[0]['paths']==['/lab/piano']
          assert 'journal-v15-liquid-piano.css' in piano[0]['styles']
          assert 'journal-v15-liquid-piano.js' in piano[0]['scripts']
          js=Path('journal-v15-liquid-piano.js').read_text()
          css=Path('journal-v15-liquid-piano.css').read_text()
          html=Path('index.html').read_text()
          loader=Path('journal-route-loader.js').read_text()
          for token in ["AudioContext","pointerdown","pointermove","Convolver","data-lp-sustain","KEY_CODES","max=76","sourceDown","sourceUp"]:
              assert token in js, token
          for token in ["backdrop-filter:blur(24px)","touch-action:none",".lp-key.is-down",":fullscreen"]:
              assert token in css, token
          assert 'href="#/lab/piano" data-nav="piano"' in html
          assert 'SITE46-LIQUIDPIANO1-20260915-1110' in loader
          print('liquid piano static contracts: OK')
          PY
