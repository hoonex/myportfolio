name: Temporary Liquid Piano v4 verify
on:
  push:
    branches:
      - fix/liquid-piano-v4-ultra-optics
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/liquid-piano-v4-ultra-optics
      - name: Apply optimizer
        run: python3 _tmp_liquid_piano_v4_patch.py
      - name: Verify JavaScript syntax
        run: node --check journal-v15-liquid-piano.js && node --check journal-route-loader.js
      - name: Verify contracts
        run: |
          grep -q "PIANO4-ULTRA-20260916-0751" journal-v15-liquid-piano.js
          grep -q "mobilePx:135000" journal-v15-liquid-piano.js
          grep -q "u_quality<1.5" journal-v15-liquid-piano.js
          grep -q "function frame(){raf=0" journal-v15-liquid-piano.js
          grep -q "SITE51-LIQUIDPIANO4-ULTRA-20260916-0751" journal-route-loader.js
          grep -q "SITE51-LIQUIDPIANO4-ULTRA-20260916-0751" index.html
          ! grep -q "backdrop-filter" journal-v15-liquid-piano.css
      - name: Commit product patch
        run: |
          git config user.name "hoonex"
          git config user.email "163626004+hoonex@users.noreply.github.com"
          git add journal-v15-liquid-piano.js journal-v15-liquid-piano.css journal-route-loader.js index.html
          git diff --cached --quiet || git commit -m "perf: ultra-optimize Liquid Piano optics"
          git push origin HEAD:fix/liquid-piano-v4-ultra-optics
