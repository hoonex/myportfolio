name: Temporary Liquid Piano v2 verify
on:
  push:
    branches:
      - fix/liquid-piano-v2-webgl
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify optimized piano
        run: |
          node --check journal-v15-liquid-piano.js
          node --check journal-route-loader.js
          python - <<'PY'
          from pathlib import Path
          import json
          js=Path('journal-v15-liquid-piano.js').read_text()
          css=Path('journal-v15-liquid-piano.css').read_text()
          loader=Path('journal-route-loader.js').read_text()
          manifest=json.loads(Path('runtime-manifest.json').read_text())
          assert "PIANO2-WEBGL-20260915-1135" in js
          assert "SITE47-LIQUIDPIANO2-WEBGL-20260915-1135" in loader
          assert "getContext('webgl2'" in js
          assert js.count('drawArraysInstanced') >= 2
          assert 'gl.blitFramebuffer' in js
          assert 'MAX_POLY=12' in js
          assert 'createConvolver' not in js
          assert 'convolver' not in js.lower()
          assert 'backdrop-filter' not in css
          assert '-webkit-backdrop-filter' not in css
          assert 'filter:blur' not in css.replace(' ','')
          assert 'requestAnimationFrame(frame)' in js
          assert 'if(active)raf=requestAnimationFrame(frame);else lastFrame=0' in js
          assert "coarse?.82:1" in js and 'maxPx=coarse?850000:1500000' in js
          group=next(x for x in manifest['routes'] if x['id']=='liquid-piano')
          assert group['paths']==['/lab/piano']
          assert group['styles']==['journal-v15-liquid-piano.css']
          assert group['scripts']==['journal-v15-liquid-piano.js']
          assert len(js.encode()) < 30000
          assert len(css.encode()) < 12000
          print('Liquid Piano v2 static/performance contracts: OK')
          PY
