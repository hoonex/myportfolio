name: Fix Vision realtime once
on:
  push:
    branches:
      - feat/design-journal-liquid-glass-20260827
    paths:
      - .github/workflows/fix-vision-realtime-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/design-journal-liquid-glass-20260827
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/fix-vision-realtime-once.py
      - name: Commit patch
        run: |
          rm .github/workflows/fix-vision-realtime-once.yml .github/scripts/fix-vision-realtime-once.py
          git config user.name hoonex
          git config user.email 163626004+hoonex@users.noreply.github.com
          git add -A
          git commit -m 'fix: make Vision tracking genuinely realtime'
          git push origin HEAD:feat/design-journal-liquid-glass-20260827