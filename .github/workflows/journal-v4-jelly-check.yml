name: Journal v4 jelly check

on:
  push:
    branches:
      - feat/design-journal-liquid-glass-20260827

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: node --check site/journal-v4-jelly.js
      - name: Validate preferred optical defaults
        run: |
          grep -q 'refraction: 1.60' site/journal-v4-jelly.js
          grep -q 'blurAmount: 0.00' site/journal-v4-jelly.js
          grep -q 'chromAberration: 0.180' site/journal-v4-jelly.js
          grep -q 'specular: 0.00' site/journal-v4-jelly.js
          grep -q 'fresnel: 0.00' site/journal-v4-jelly.js
          grep -q 'edgeHighlight: 0.00' site/journal-v4-jelly.js
          grep -q 'zRadius: 50' site/journal-v4-jelly.js
          grep -q 'cornerRadius: 80' site/journal-v4-jelly.js
          grep -q 'saturation: 0.02' site/journal-v4-jelly.js
          grep -q 'brightness: 0.02' site/journal-v4-jelly.js
      - name: Ensure drag transform is not clobbered
        run: |
          grep -q "setProperty('scale'" site/journal-v4-jelly.js
          grep -q "setProperty('rotate'" site/journal-v4-jelly.js
          ! grep -q 'style.transform =' site/journal-v4-jelly.js
      - name: Validate page integration
        run: |
          grep -q 'journal-v4-jelly.css' site/index.html
          grep -q 'journal-v4-jelly.js' site/index.html
