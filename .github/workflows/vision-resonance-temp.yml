name: Build Vision Resonance instrument

on:
  push:
    branches:
      - feat/vision-resonance-instrument

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vision-resonance-instrument
          fetch-depth: 0
      - name: Apply patch
        run: python .github/vision-resonance-patch.py
      - name: Verify runtime and instrument contract
        run: |
          set -euo pipefail
          node --check journal-v14-vision.js
          node --check journal-route-loader.js
          python - <<'PY'
          from pathlib import Path
          s=Path('journal-v14-vision.js').read_text()
          assert "BUILD='VISION14.3-20260914-1043'" in s
          assert 'data-v14-mode="resonance">Resonance' in s
          assert "resonance:['Resonance'" in s
          assert 'function ensureAudio()' in s
          assert 'function updateResonance(' in s
          assert 'function drawResonance(' in s
          assert 'createOscillator()' in s and 'createBiquadFilter()' in s and 'createDelay(.8)' in s
          assert 'audioEngine.voices' in s
          assert 'resonanceNoteAtY' in s
          assert "blend('jawOpen')" in s
          assert "state.mode==='resonance'" in s
          assert "state.mode==='bloom'" not in s
          assert 'function updateBloom' not in s and 'function drawBloom' not in s
          order=['drawFace(ctx,F,w,h)','H.forEach((x,i)=>drawHand(ctx,x,i,w))','drawArt(ctx,w,h,ps,F,now)','drawPinchFeedback(ctx,ps,w,h)']
          pos=[s.index(x) for x in order]
          assert pos==sorted(pos), pos
          rev='SITE40-VISION14_3-20260914-1043'
          assert rev in Path('journal-route-loader.js').read_text()
          assert Path('index.html').read_text().count(rev)==2
          print('Vision Resonance contract: ok')
          PY
      - name: Commit product changes
        run: |
          set -euo pipefail
          rm .github/workflows/vision-resonance-temp.yml .github/vision-resonance-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: replace Bloom with a dual-hand Resonance instrument"
          git push origin HEAD:feat/vision-resonance-instrument
