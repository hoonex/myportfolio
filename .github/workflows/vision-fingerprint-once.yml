name: Vision fingerprint once
on:
  push:
    branches:
      - feat/design-journal-liquid-glass-20260827
    paths:
      - .github/workflows/vision-fingerprint-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/design-journal-liquid-glass-20260827
      - name: Fingerprint Vision route assets
        shell: bash
        run: |
          set -euo pipefail
          cp site/journal-v11-vision.js site/journal-v11-vision-f2-20260830.js
          cp site/journal-v11-vision.css site/journal-v11-vision-f2-20260830.css
          cp site/journal-v12-vision-privacy.js site/journal-v12-vision-privacy-f2-20260830.js
          python - <<'PY'
          import json
          p='site/runtime-manifest.json'
          d=json.load(open(p,encoding='utf-8'))
          d['vision_build']='F2-20260830-1957'
          for g in d['routes']:
              if g.get('id')=='vision':
                  g['styles']=['journal-v11-vision-f2-20260830.css']
                  g['scripts']=['journal-v11-vision-f2-20260830.js','journal-v12-vision-privacy-f2-20260830.js','vision-build-f2-20260830.js']
          open(p,'w',encoding='utf-8').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          rm .github/workflows/vision-fingerprint-once.yml
          git config user.name hoonex
          git config user.email 163626004+hoonex@users.noreply.github.com
          git add -A
          git commit -m "fix: fingerprint Vision F2 assets"
          git push origin HEAD:feat/design-journal-liquid-glass-20260827
